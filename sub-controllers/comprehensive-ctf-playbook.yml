---
# CTF Challenge Verification Playbook
# This playbook checks multiple challenges and reports results back to the CTF tracker
# Supports various challenge types: services, packages, configurations, files, etc.

- name: CTF Challenge Verification
  hosts: "{{ target_host | default('all') }}"
  gather_facts: yes
  vars:
    # Available challenge types
    challenge_types:
      - apache_check
      - nginx_check
      - mysql_check
      - firewall_check
      - user_check
      - file_check
      - service_check
      - package_check
      - port_check
      - custom_command

  tasks:
    - name: Display challenge information
      debug:
        msg: |
          =================================
          CTF CHALLENGE VERIFICATION
          =================================
          Target Host: {{ inventory_hostname }}
          Attendee: {{ attendee_name | default('Not specified') }}
          Challenge Config: {{ challenge_config | default({}) }}
          Tracker URL: {{ ctf_tracker_url | default('Not configured') }}
          =================================

    - name: Initialize results tracking
      set_fact:
        challenge_results: {}
        total_points: 0
        challenges_completed: 0
        challenges_failed: 0

    # APACHE HTTP SERVER CHALLENGE
    - name: Check Apache HTTP Server Challenge
      block:
        - name: Check if httpd package is installed
          package_facts:
            manager: auto

        - name: Check httpd service status
          systemd:
            name: httpd
          register: httpd_service
          ignore_errors: yes

        - name: Check Apache configuration files
          stat:
            path: "{{ item }}"
          register: apache_config_files
          loop:
            - /etc/httpd/conf/httpd.conf
            - /var/www/html/index.html
            - /etc/httpd/conf.d/welcome.conf

        - name: Check if Apache is listening on port 80
          wait_for:
            port: 80
            host: "{{ ansible_default_ipv4.address }}"
            timeout: 5
          register: apache_port_check
          ignore_errors: yes

        - name: Evaluate Apache challenge
          set_fact:
            apache_installed: "{{ 'httpd' in ansible_facts.packages }}"
            apache_running: "{{ httpd_service.status.ActiveState == 'active' if httpd_service.status is defined else false }}"
            apache_config_exists: "{{ apache_config_files.results[0].stat.exists }}"
            apache_port_open: "{{ apache_port_check is succeeded }}"

        - name: Calculate Apache challenge points
          set_fact:
            apache_points: "{{ ((apache_installed | int * 3) + (apache_running | int * 4) + (apache_config_exists | int * 2) + (apache_port_open | int * 1)) }}"
            apache_max_points: 10

        - name: Update Apache challenge results
          set_fact:
            challenge_results: >-
              {{
                challenge_results | combine({
                  'apache_check': {
                    'completed': apache_points | int >= apache_max_points | int,
                    'points_earned': apache_points | int,
                    'max_points': apache_max_points | int,
                    'details': {
                      'package_installed': apache_installed,
                      'service_running': apache_running,
                      'config_exists': apache_config_exists,
                      'port_accessible': apache_port_open
                    }
                  }
                })
              }}

      when: "'apache_check' in (challenge_config.challenge_types | default(['apache_check']))"

    # NGINX CHALLENGE
    - name: Check Nginx Challenge
      block:
        - name: Check if nginx package is installed
          package_facts:
            manager: auto

        - name: Check nginx service status
          systemd:
            name: nginx
          register: nginx_service
          ignore_errors: yes

        - name: Check nginx configuration
          stat:
            path: /etc/nginx/nginx.conf
          register: nginx_config

        - name: Check if Nginx is listening on port 80
          wait_for:
            port: 80
            host: "{{ ansible_default_ipv4.address }}"
            timeout: 5
          register: nginx_port_check
          ignore_errors: yes

        - name: Evaluate Nginx challenge
          set_fact:
            nginx_installed: "{{ 'nginx' in ansible_facts.packages }}"
            nginx_running: "{{ nginx_service.status.ActiveState == 'active' if nginx_service.status is defined else false }}"
            nginx_config_exists: "{{ nginx_config.stat.exists }}"
            nginx_port_open: "{{ nginx_port_check is succeeded }}"

        - name: Calculate Nginx challenge points
          set_fact:
            nginx_points: "{{ ((nginx_installed | int * 4) + (nginx_running | int * 4) + (nginx_config_exists | int * 1) + (nginx_port_open | int * 1)) }}"
            nginx_max_points: 10

        - name: Update Nginx challenge results
          set_fact:
            challenge_results: >-
              {{
                challenge_results | combine({
                  'nginx_check': {
                    'completed': nginx_points | int >= nginx_max_points | int,
                    'points_earned': nginx_points | int,
                    'max_points': nginx_max_points | int,
                    'details': {
                      'package_installed': nginx_installed,
                      'service_running': nginx_running,
                      'config_exists': nginx_config_exists,
                      'port_accessible': nginx_port_open
                    }
                  }
                })
              }}

      when: "'nginx_check' in (challenge_config.challenge_types | default([]))"

    # MYSQL/MARIADB CHALLENGE
    - name: Check MySQL/MariaDB Challenge
      block:
        - name: Check if MySQL/MariaDB packages are installed
          package_facts:
            manager: auto

        - name: Check mariadb service status
          systemd:
            name: mariadb
          register: mariadb_service
          ignore_errors: yes

        - name: Check MySQL port
          wait_for:
            port: 3306
            host: "{{ ansible_default_ipv4.address }}"
            timeout: 5
          register: mysql_port_check
          ignore_errors: yes

        - name: Evaluate MySQL challenge
          set_fact:
            mysql_installed: "{{ 'mariadb-server' in ansible_facts.packages or 'mysql-server' in ansible_facts.packages }}"
            mysql_running: "{{ mariadb_service.status.ActiveState == 'active' if mariadb_service.status is defined else false }}"
            mysql_port_open: "{{ mysql_port_check is succeeded }}"

        - name: Calculate MySQL challenge points
          set_fact:
            mysql_points: "{{ ((mysql_installed | int * 5) + (mysql_running | int * 3) + (mysql_port_open | int * 2)) }}"
            mysql_max_points: 10

        - name: Update MySQL challenge results
          set_fact:
            challenge_results: >-
              {{
                challenge_results | combine({
                  'mysql_check': {
                    'completed': mysql_points | int >= mysql_max_points | int,
                    'points_earned': mysql_points | int,
                    'max_points': mysql_max_points | int,
                    'details': {
                      'package_installed': mysql_installed,
                      'service_running': mysql_running,
                      'port_accessible': mysql_port_open
                    }
                  }
                })
              }}

      when: "'mysql_check' in (challenge_config.challenge_types | default([]))"

    # FIREWALL CHALLENGE
    - name: Check Firewall Challenge
      block:
        - name: Check firewalld service status
          systemd:
            name: firewalld
          register: firewalld_service
          ignore_errors: yes

        - name: Get firewall zones (if firewalld is running)
          command: firewall-cmd --get-active-zones
          register: firewall_zones
          ignore_errors: yes
          when: firewalld_service.status.ActiveState == 'active'

        - name: Check if HTTP service is allowed
          command: firewall-cmd --query-service=http
          register: http_allowed
          ignore_errors: yes
          when: firewalld_service.status.ActiveState == 'active'

        - name: Evaluate Firewall challenge
          set_fact:
            firewall_running: "{{ firewalld_service.status.ActiveState == 'active' if firewalld_service.status is defined else false }}"
            firewall_configured: "{{ firewall_zones.rc == 0 if firewall_zones is defined else false }}"
            http_service_allowed: "{{ http_allowed.rc == 0 if http_allowed is defined else false }}"

        - name: Calculate Firewall challenge points
          set_fact:
            firewall_points: "{{ ((firewall_running | int * 4) + (firewall_configured | int * 3) + (http_service_allowed | int * 3)) }}"
            firewall_max_points: 10

        - name: Update Firewall challenge results
          set_fact:
            challenge_results: >-
              {{
                challenge_results | combine({
                  'firewall_check': {
                    'completed': firewall_points | int >= firewall_max_points | int,
                    'points_earned': firewall_points | int,
                    'max_points': firewall_max_points | int,
                    'details': {
                      'service_running': firewall_running,
                      'zones_configured': firewall_configured,
                      'http_allowed': http_service_allowed
                    }
                  }
                })
              }}

      when: "'firewall_check' in (challenge_config.challenge_types | default([]))"

    # USER MANAGEMENT CHALLENGE
    - name: Check User Management Challenge
      block:
        - name: Check if specific users exist
          getent:
            database: passwd
            key: "{{ item }}"
          register: user_check
          ignore_errors: yes
          loop: "{{ challenge_config.required_users | default(['webadmin', 'developer']) }}"

        - name: Check sudo configuration
          stat:
            path: /etc/sudoers.d/webadmin
          register: sudo_config

        - name: Evaluate User Management challenge
          set_fact:
            required_users_exist: "{{ user_check.results | selectattr('failed', 'equalto', false) | list | length }}"
            sudo_configured: "{{ sudo_config.stat.exists }}"

        - name: Calculate User Management challenge points
          set_fact:
            user_points: "{{ ((required_users_exist | int * 3) + (sudo_configured | int * 4)) }}"
            user_max_points: 10

        - name: Update User Management challenge results
          set_fact:
            challenge_results: >-
              {{
                challenge_results | combine({
                  'user_check': {
                    'completed': user_points | int >= user_max_points | int,
                    'points_earned': user_points | int,
                    'max_points': user_max_points | int,
                    'details': {
                      'users_created': required_users_exist,
                      'sudo_configured': sudo_configured
                    }
                  }
                })
              }}

      when: "'user_check' in (challenge_config.challenge_types | default([]))"

    # CUSTOM COMMAND CHALLENGES
    - name: Execute Custom Command Challenges
      block:
        - name: Run custom verification commands
          shell: "{{ item.command }}"
          register: custom_command_results
          ignore_errors: yes
          loop: "{{ challenge_config.custom_commands | default([]) }}"
          when: challenge_config.custom_commands is defined

        - name: Evaluate custom command results
          set_fact:
            custom_results: "{{ custom_results | default([]) + [{'name': item.item.name, 'success': item.rc == 0, 'points': item.item.points if item.rc == 0 else 0}] }}"
          loop: "{{ custom_command_results.results | default([]) }}"
          when: custom_command_results is defined

        - name: Calculate custom commands points
          set_fact:
            custom_total_points: "{{ custom_results | sum(attribute='points') | default(0) }}"

        - name: Update Custom Commands challenge results
          set_fact:
            challenge_results: >-
              {{
                challenge_results | combine({
                  'custom_commands': {
                    'completed': true,
                    'points_earned': custom_total_points | int,
                    'max_points': (challenge_config.custom_commands | sum(attribute='points') | default(0)) | int,
                    'details': custom_results
                  }
                })
              }}

      when: "'custom_command' in (challenge_config.challenge_types | default([]))"

    # CALCULATE FINAL RESULTS
    - name: Debug challenge results before calculation
      debug:
        var: challenge_results

    - name: Calculate total results
      set_fact:
        total_points: "{{ (challenge_results | dict2items | map(attribute='value.points_earned') | sum | default(0)) | int }}"
        max_possible_points: "{{ (challenge_results | dict2items | map(attribute='value.max_points') | sum | default(0)) | int }}"
        challenges_completed: "{{ (challenge_results | dict2items | selectattr('value.completed', 'equalto', true) | list | length) | int }}"
        total_challenges: "{{ (challenge_results | dict2items | list | length) | int }}"

    - name: Debug calculated totals
      debug:
        msg: |
          Debug Totals:
          - total_points: {{ total_points }} (type: {{ total_points | type_debug }})
          - max_possible_points: {{ max_possible_points }} (type: {{ max_possible_points | type_debug }})
          - challenges_completed: {{ challenges_completed }} (type: {{ challenges_completed | type_debug }})
          - total_challenges: {{ total_challenges }} (type: {{ total_challenges | type_debug }})

    # REPORT RESULTS BACK TO CTF TRACKER
    - name: Get or create attendee in CTF Tracker
      uri:
        url: "{{ ctf_tracker_url }}/api/attendees"
        method: GET
        validate_certs: no
      register: attendees_response
      ignore_errors: yes
      when: ctf_tracker_url is defined and ctf_tracker_url != ''

    - name: Find attendee ID by name
      set_fact:
        attendee_id: "{{ attendees_response.json | selectattr('name', 'equalto', attendee_name | default('unknown')) | map(attribute='id') | first | default(None) }}"
      when: 
        - attendees_response is succeeded
        - attendees_response.json is defined

    - name: Create attendee if not found
      uri:
        url: "{{ ctf_tracker_url }}/api/attendees"
        method: POST
        body_format: json
        headers:
          Content-Type: "application/json"
        body:
          name: "{{ attendee_name | default('unknown') }}"
          email: "{{ attendee_email | default('') }}"
        validate_certs: no
      register: create_attendee_response
      ignore_errors: yes
      when: 
        - ctf_tracker_url is defined and ctf_tracker_url != ''
        - attendee_id is not defined or attendee_id == None

    - name: Set attendee ID from creation response
      set_fact:
        attendee_id: "{{ create_attendee_response.json.id }}"
      when: 
        - create_attendee_response is defined
        - create_attendee_response is succeeded
        - create_attendee_response.json is defined
        - create_attendee_response.json.id is defined

    - name: Debug attendee ID resolution
      debug:
        msg: |
          Attendee ID Resolution:
          - attendee_name: {{ attendee_name | default('unknown') }}
          - resolved attendee_id: {{ attendee_id | default('NOT RESOLVED') }}

    - name: Report results to CTF Tracker
      uri:
        url: "{{ ctf_tracker_url }}/api/challenge_results"
        method: POST
        body_format: json
        headers:
          Content-Type: "application/json"
        body:
          hostname: "{{ inventory_hostname }}"
          attendee_id: "{{ attendee_id | int }}"
          challenge_results: "{{ challenge_results }}"
          summary:
            total_points: "{{ total_points | int }}"
            max_possible_points: "{{ max_possible_points | int }}"
            challenges_completed: "{{ challenges_completed | int }}"
            total_challenges: "{{ total_challenges | int }}"
            completion_percentage: "{% if total_challenges | int > 0 %}{{ ((challenges_completed | int | float / total_challenges | int | float) * 100) | round(1) }}{% else %}0.0{% endif %}"
          timestamp: "{{ ansible_date_time.iso8601 }}"
        validate_certs: no
      register: tracker_response
      ignore_errors: yes
      when: 
        - ctf_tracker_url is defined and ctf_tracker_url != ''
        - attendee_id is defined and attendee_id != None

    # DISPLAY FINAL RESULTS
    - name: Display Challenge Results Summary
      debug:
        msg: |
          ==========================================
          CTF CHALLENGE VERIFICATION COMPLETE
          ==========================================
          Host: {{ inventory_hostname }}
          Attendee: {{ attendee_name | default('unknown') }}
          
          RESULTS SUMMARY:
          ----------------
          Total Points Earned: {{ total_points }}/{{ max_possible_points }}
          Challenges Completed: {{ challenges_completed }}/{{ total_challenges }}
          Completion Rate: {% if total_challenges | int > 0 %}{{ ((challenges_completed | int | float / total_challenges | int | float) * 100) | round(1) }}%{% else %}0.0%{% endif %}
          
          DETAILED RESULTS:
          ----------------
          {% for challenge_name, result in challenge_results.items() %}
          {{ challenge_name | upper }}:
            Status: {{ 'COMPLETED' if result.completed else 'INCOMPLETE' }}
            Points: {{ result.points_earned }}/{{ result.max_points }}
            Details: {{ result.details }}
          {% endfor %}
          
          Tracker Update: {{ 'SUCCESS' if tracker_response is defined and tracker_response is succeeded else 'SKIPPED' }}
          ==========================================

    - name: Create results file for debugging
      copy:
        content: |
          CTF Challenge Results - {{ ansible_date_time.iso8601 }}
          Host: {{ inventory_hostname }}
          Attendee: {{ attendee_name | default('unknown') }}
          
          {{ challenge_results | to_nice_json }}
        dest: "/tmp/ctf_results_{{ attendee_name | default('unknown') }}_{{ ansible_date_time.epoch }}.json"
      ignore_errors: yes

