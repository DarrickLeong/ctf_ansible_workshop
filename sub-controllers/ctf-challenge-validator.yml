---
# CTF Workshop Challenge Validator
# This playbook validates the 6 specific CTF challenges and reports scores to the tracker
# Designed to work with the CTF Workshop structure

- name: CTF Workshop Challenge Validation
  hosts: "{{ target_host | default('web') }}"
  become: yes
  gather_facts: yes
  vars:
    # CTF Tracker URL (required)
    # ctf_tracker_url: "http://ctf-tracker.apps.YOUR-CLUSTER.com"
    
    # Attendee information (required)
    # attendee_name: "student1"
    
    # AAP cluster identifier (optional)
    # aap_cluster_id: "sub-controller-east"

  tasks:
    - name: Display validation information
      debug:
        msg: |
          ==========================================
          CTF WORKSHOP CHALLENGE VALIDATION
          ==========================================
          Host: {{ inventory_hostname }}
          Attendee: {{ attendee_name | default('Not specified') }}
          Tracker: {{ ctf_tracker_url | default('Not configured') }}
          ==========================================

    - name: Initialize challenge results
      set_fact:
        challenge_results: {}

    # ==========================================
    # CHALLENGE 1: Out of Sync (5 Points)
    # Check if chronyd service is running and enabled
    # ==========================================
    - name: Challenge 1 - Check chronyd service
      block:
        - name: Check chronyd service status
          systemd:
            name: chronyd
          register: chronyd_status
          ignore_errors: yes

        - name: Evaluate Challenge 1
          set_fact:
            challenge1_running: "{{ chronyd_status.status.ActiveState == 'active' if chronyd_status.status is defined else false }}"
            challenge1_enabled: "{{ chronyd_status.status.UnitFileState == 'enabled' if chronyd_status.status is defined else false }}"

        - name: Calculate Challenge 1 points
          set_fact:
            challenge1_points: "{{ ((challenge1_running | int * 3) + (challenge1_enabled | int * 2)) }}"
            challenge1_completed: "{{ (challenge1_running and challenge1_enabled) }}"

        - name: Update Challenge 1 results
          set_fact:
            challenge_results: >-
              {{
                challenge_results | combine({
                  'challenge1_chronyd': {
                    'completed': challenge1_completed,
                    'points_earned': challenge1_points | int,
                    'max_points': 5,
                    'details': {
                      'service_running': challenge1_running,
                      'service_enabled': challenge1_enabled
                    }
                  }
                })
              }}

    # ==========================================
    # CHALLENGE 2: Malicious Package (10 Points)
    # Check if bind-utils package is ABSENT from node2
    # ==========================================
    - name: Challenge 2 - Check unauthorized package removal
      block:
        - name: Get package facts
          package_facts:
            manager: auto

        - name: Evaluate Challenge 2
          set_fact:
            challenge2_package_absent: "{{ 'bind-utils' not in ansible_facts.packages }}"
            challenge2_applies: "{{ inventory_hostname == 'node2' or 'node2' in inventory_hostname }}"

        - name: Calculate Challenge 2 points
          set_fact:
            challenge2_points: "{{ 10 if (challenge2_applies and challenge2_package_absent) else 0 }}"
            challenge2_completed: "{{ challenge2_applies and challenge2_package_absent }}"

        - name: Update Challenge 2 results
          set_fact:
            challenge_results: >-
              {{
                challenge_results | combine({
                  'challenge2_package_removal': {
                    'completed': challenge2_completed,
                    'points_earned': challenge2_points | int,
                    'max_points': 10,
                    'details': {
                      'applies_to_node2': challenge2_applies,
                      'package_absent': challenge2_package_absent,
                      'hostname': inventory_hostname
                    }
                  }
                })
              }}
      when: "'node2' in inventory_hostname or inventory_hostname == 'node2'"

    # ==========================================
    # CHALLENGE 3: Rogue User Account (15 Points)
    # Check if rogue_user is ABSENT from node1 and node3
    # ==========================================
    - name: Challenge 3 - Check rogue_user removal
      block:
        - name: Check if rogue_user exists
          getent:
            database: passwd
            key: rogue_user
          register: rogue_user_check
          ignore_errors: yes

        - name: Evaluate Challenge 3
          set_fact:
            challenge3_user_absent: "{{ rogue_user_check is failed }}"
            challenge3_applies: "{{ inventory_hostname in ['node1', 'node3'] or 'node1' in inventory_hostname or 'node3' in inventory_hostname }}"

        - name: Calculate Challenge 3 points
          set_fact:
            challenge3_points: "{{ 15 if (challenge3_applies and challenge3_user_absent) else 0 }}"
            challenge3_completed: "{{ challenge3_applies and challenge3_user_absent }}"

        - name: Update Challenge 3 results
          set_fact:
            challenge_results: >-
              {{
                challenge_results | combine({
                  'challenge3_rogue_user': {
                    'completed': challenge3_completed,
                    'points_earned': challenge3_points | int,
                    'max_points': 15,
                    'details': {
                      'applies_to_host': challenge3_applies,
                      'user_absent': challenge3_user_absent,
                      'hostname': inventory_hostname
                    }
                  }
                })
              }}
      when: "'node1' in inventory_hostname or 'node3' in inventory_hostname or inventory_hostname in ['node1', 'node3']"

    # ==========================================
    # CHALLENGE 4: Inconsistent Messaging (20 Points)
    # Check if MOTD matches expected template
    # ==========================================
    - name: Challenge 4 - Check MOTD configuration
      block:
        - name: Check if /etc/motd exists
          stat:
            path: /etc/motd
          register: motd_file

        - name: Read MOTD content
          slurp:
            src: /etc/motd
          register: motd_content
          when: motd_file.stat.exists

        - name: Evaluate Challenge 4
          set_fact:
            challenge4_file_exists: "{{ motd_file.stat.exists }}"
            challenge4_content: "{{ motd_content.content | b64decode if motd_file.stat.exists else '' }}"

        - name: Check MOTD content correctness
          set_fact:
            challenge4_has_hostname: "{{ ansible_hostname in challenge4_content }}"
            challenge4_has_sre: "{{ 'SRE Team' in challenge4_content or 'Managed by SRE' in challenge4_content }}"

        - name: Evaluate Challenge 4 completion
          set_fact:
            challenge4_correct: "{{ challenge4_file_exists and challenge4_has_hostname and challenge4_has_sre }}"

        - name: Calculate Challenge 4 points
          set_fact:
            challenge4_points: "{{ 20 if challenge4_correct else 0 }}"
            challenge4_completed: "{{ challenge4_correct }}"

        - name: Update Challenge 4 results
          set_fact:
            challenge_results: >-
              {{
                challenge_results | combine({
                  'challenge4_motd': {
                    'completed': challenge4_completed,
                    'points_earned': challenge4_points | int,
                    'max_points': 20,
                    'details': {
                      'file_exists': challenge4_file_exists,
                      'contains_hostname': challenge4_has_hostname,
                      'contains_sre_team': challenge4_has_sre,
                      'hostname': ansible_hostname
                    }
                  }
                })
              }}

    # ==========================================
    # CHALLENGE 5: Firewall Anomaly (20 Points)
    # Check if HTTP service is allowed in firewall on node3
    # ==========================================
    - name: Challenge 5 - Check firewall HTTP service
      block:
        - name: Check firewalld service status
          systemd:
            name: firewalld
          register: firewalld_status
          ignore_errors: yes

        - name: Get firewalld facts
          ansible.builtin.command: firewall-cmd --list-services
          register: firewall_services
          changed_when: false
          ignore_errors: yes
          when: firewalld_status.status.ActiveState == 'active'

        - name: Get permanent firewalld services
          ansible.builtin.command: firewall-cmd --permanent --list-services
          register: firewall_services_permanent
          changed_when: false
          ignore_errors: yes
          when: firewalld_status.status.ActiveState == 'active'

        - name: Evaluate Challenge 5
          set_fact:
            challenge5_firewall_running: "{{ firewalld_status.status.ActiveState == 'active' if firewalld_status.status is defined else false }}"
            challenge5_http_allowed: "{{ ('http' in firewall_services.stdout) if firewall_services.stdout is defined else false }}"
            challenge5_http_permanent: "{{ ('http' in firewall_services_permanent.stdout) if firewall_services_permanent.stdout is defined else false }}"
            challenge5_applies: "{{ inventory_hostname == 'node3' or 'node3' in inventory_hostname }}"

        - name: Calculate Challenge 5 points
          set_fact:
            challenge5_points: "{{ 20 if (challenge5_applies and challenge5_firewall_running and challenge5_http_allowed and challenge5_http_permanent) else 0 }}"
            challenge5_completed: "{{ challenge5_applies and challenge5_firewall_running and challenge5_http_allowed and challenge5_http_permanent }}"

        - name: Update Challenge 5 results
          set_fact:
            challenge_results: >-
              {{
                challenge_results | combine({
                  'challenge5_firewall': {
                    'completed': challenge5_completed,
                    'points_earned': challenge5_points | int,
                    'max_points': 20,
                    'details': {
                      'applies_to_node3': challenge5_applies,
                      'firewall_running': challenge5_firewall_running,
                      'http_allowed': challenge5_http_allowed,
                      'http_permanent': challenge5_http_permanent,
                      'hostname': inventory_hostname
                    }
                  }
                })
              }}
      when: "'node3' in inventory_hostname or inventory_hostname == 'node3'"

    # ==========================================
    # CHALLENGE 6: Phoenix Protocol (30 Points Total)
    # Incremental scoring for each playbook:
    #   1. Provision Database (5 points)
    #   2. Provision Web Server (5 points)
    #   3. Deploy Application (5 points)
    #   4. Validate Service (5 points)
    #   5. Rollback Web Server (5 points)
    #   6. Rollback Database (5 points)
    # ==========================================
    - name: Challenge 6 - Check Phoenix Protocol completion
      block:
        # Step 1: Check Database Provisioning (5 points)
        - name: Check if PostgreSQL service is running (node2)
          systemd:
            name: postgresql
          register: db_service_check
          ignore_errors: yes
          when: inventory_hostname == 'node2' or 'node2' in inventory_hostname

        - name: Check if PostgreSQL is initialized (node2)
          stat:
            path: /var/lib/pgsql/data/postgresql.conf
          register: db_initialized
          ignore_errors: yes
          when: inventory_hostname == 'node2' or 'node2' in inventory_hostname

        # Step 2: Check Web Server Provisioning (5 points)
        - name: Check if httpd service is running (node1)
          systemd:
            name: httpd
          register: web_service_check
          ignore_errors: yes
          when: inventory_hostname == 'node1' or 'node1' in inventory_hostname

        - name: Check if httpd is listening on port 8080 (node1)
          shell: netstat -tuln | grep ':8080 ' || ss -tuln | grep ':8080 '
          register: port_8080_check
          failed_when: false
          changed_when: false
          ignore_errors: yes
          when: inventory_hostname == 'node1' or 'node1' in inventory_hostname

        - name: Check if SELinux port 8080 is configured (node1)
          shell: semanage port -l | grep "http_port_t" | grep -w "8080"
          register: selinux_8080_check
          failed_when: false
          changed_when: false
          ignore_errors: yes
          when: inventory_hostname == 'node1' or 'node1' in inventory_hostname

        - name: Check if firewall allows port 8080 (node1)
          command: firewall-cmd --list-ports
          register: firewall_8080_check
          failed_when: false
          changed_when: false
          ignore_errors: yes
          when: inventory_hostname == 'node1' or 'node1' in inventory_hostname

        # Step 3: Check Application Deployment (5 points)
        - name: Check if application file exists (node1)
          stat:
            path: /var/www/html/index.php
          register: app_deployed
          ignore_errors: yes
          when: inventory_hostname == 'node1' or 'node1' in inventory_hostname

        # Step 4: Check Validation - All services running AND app responds correctly (5 points)
        # No marker file needed - we validate actual state!
        - name: Test HTTP response for validation step
          ansible.builtin.uri:
            url: "http://{{ ansible_default_ipv4.address }}:8080/index.php"
            method: GET
            status_code: 200
            return_content: yes
            timeout: 5
          register: validation_http_test
          failed_when: false
          ignore_errors: yes
          when: inventory_hostname == 'node1' or 'node1' in inventory_hostname

        # Steps 5 & 6: Rollback checks (5 points each)
        # These are validated by checking if rollback was executed AND services are in clean state
        - name: Check for web rollback marker (node1)
          stat:
            path: /tmp/phoenix_web_rollback
          register: web_rollback_marker
          ignore_errors: yes
          when: inventory_hostname == 'node1' or 'node1' in inventory_hostname

        - name: Check for db rollback marker (node2)
          stat:
            path: /tmp/phoenix_db_rollback
          register: db_rollback_marker
          ignore_errors: yes
          when: inventory_hostname == 'node2' or 'node2' in inventory_hostname

        # Evaluate each step
        - name: Evaluate Challenge 6 - Step 1 (Provision Database)
          set_fact:
            challenge6_step1_db_provisioned: "{{ 
              (db_service_check.status.ActiveState == 'active' if db_service_check.status is defined else false) and
              (db_initialized.stat.exists if db_initialized.stat is defined else false)
            }}"

        - name: Evaluate Challenge 6 - Step 2 (Provision Web Server)
          set_fact:
            challenge6_step2_web_provisioned: "{{
              (web_service_check.status.ActiveState == 'active' if web_service_check.status is defined else false) and
              (port_8080_check.rc == 0 if port_8080_check.rc is defined else false) and
              (selinux_8080_check.rc == 0 if selinux_8080_check.rc is defined else false) and
              ('8080' in firewall_8080_check.stdout if firewall_8080_check.stdout is defined else false)
            }}"

        - name: Evaluate Challenge 6 - Step 3 (Deploy Application)
          set_fact:
            challenge6_step3_app_deployed: "{{ app_deployed.stat.exists if app_deployed.stat is defined else false }}"

        - name: Evaluate Challenge 6 - Step 4 (Validate Service)
          set_fact:
            challenge6_step4_validated: "{{
              (web_service_check.status.ActiveState == 'active' if web_service_check.status is defined else false) and
              (db_service_check.status.ActiveState == 'active' if db_service_check.status is defined else false) and
              (validation_http_test.status == 200 if validation_http_test.status is defined else false) and
              ('healthy' in validation_http_test.content if validation_http_test.content is defined else false)
            }}"

        - name: Evaluate Challenge 6 - Step 5 (Rollback Web)
          set_fact:
            challenge6_step5_web_rollback: "{{ web_rollback_marker.stat.exists if web_rollback_marker.stat is defined else false }}"

        - name: Evaluate Challenge 6 - Step 6 (Rollback DB)
          set_fact:
            challenge6_step6_db_rollback: "{{ db_rollback_marker.stat.exists if db_rollback_marker.stat is defined else false }}"

        # Calculate total points (5 points per step)
        - name: Calculate Challenge 6 points
          set_fact:
            challenge6_points: "{{
              (challenge6_step1_db_provisioned | default(false) | bool | int * 5) +
              (challenge6_step2_web_provisioned | default(false) | bool | int * 5) +
              (challenge6_step3_app_deployed | default(false) | bool | int * 5) +
              (challenge6_step4_validated | default(false) | bool | int * 5) +
              (challenge6_step5_web_rollback | default(false) | bool | int * 5) +
              (challenge6_step6_db_rollback | default(false) | bool | int * 5)
            }}"
            challenge6_completed: "{{ challenge6_step4_validated | default(false) }}"

        - name: Update Challenge 6 results
          set_fact:
            challenge_results: >-
              {{
                challenge_results | combine({
                  'challenge6_phoenix': {
                    'completed': challenge6_completed,
                    'points_earned': challenge6_points | int,
                    'max_points': 30,
                    'details': {
                      'step1_database_provisioned': challenge6_step1_db_provisioned | default(false),
                      'step2_webserver_provisioned': challenge6_step2_web_provisioned | default(false),
                      'step3_application_deployed': challenge6_step3_app_deployed | default(false),
                      'step4_validation_passed': challenge6_step4_validated | default(false),
                      'step5_web_rollback': challenge6_step5_web_rollback | default(false),
                      'step6_db_rollback': challenge6_step6_db_rollback | default(false),
                      'hostname': inventory_hostname
                    }
                  }
                })
              }}

    # ==========================================
    # CALCULATE TOTALS
    # ==========================================
    - name: Calculate total results
      set_fact:
        total_points: "{{ (challenge_results | dict2items | map(attribute='value.points_earned') | sum | default(0)) | int }}"
        max_possible_points: "{{ (challenge_results | dict2items | map(attribute='value.max_points') | sum | default(0)) | int }}"
        challenges_completed: "{{ (challenge_results | dict2items | selectattr('value.completed', 'equalto', true) | list | length) | int }}"
        total_challenges: "{{ (challenge_results | dict2items | list | length) | int }}"

    # ==========================================
    # REPORT TO CTF TRACKER
    # ==========================================
    - name: Report results to CTF Tracker
      uri:
        url: "{{ ctf_tracker_url }}/api/challenge_results"
        method: POST
        body_format: json
        headers:
          Content-Type: "application/json"
        body:
          attendee_name: "{{ attendee_name | default('Team-' + inventory_hostname) }}"
          hostname: "{{ inventory_hostname }}"
          challenge_results: "{{ challenge_results }}"
          aap_cluster_id: "{{ aap_cluster_id | default('') }}"
        validate_certs: no
      register: tracker_response
      ignore_errors: yes
      when: 
        - ctf_tracker_url is defined
        - ctf_tracker_url != ''
        - attendee_name is defined

    # ==========================================
    # DISPLAY RESULTS
    # ==========================================
    - name: Display Challenge Results
      debug:
        msg: |
          ==========================================
          CTF WORKSHOP VALIDATION COMPLETE
          ==========================================
          Host: {{ inventory_hostname }}
          Attendee: {{ attendee_name | default('unknown') }}
          
          📊 SUMMARY:
          Total Points: {{ total_points }}/{{ max_possible_points }}
          Challenges: {{ challenges_completed }}/{{ total_challenges }} completed
          
          📝 CHALLENGE BREAKDOWN:
          Challenge 1 (chronyd): {{ challenge_results.challenge1_chronyd.points_earned | default(0) }}/5 points
          Challenge 2 (unauthorized package): {{ challenge_results.challenge2_package_removal.points_earned | default(0) }}/10 points
          Challenge 3 (rogue_user): {{ challenge_results.challenge3_rogue_user.points_earned | default(0) }}/15 points
          Challenge 4 (MOTD): {{ challenge_results.challenge4_motd.points_earned | default(0) }}/20 points
          Challenge 5 (firewall): {{ challenge_results.challenge5_firewall.points_earned | default(0) }}/20 points
          Challenge 6 (Phoenix Protocol): {{ challenge_results.challenge6_phoenix.points_earned | default(0) }}/30 points
            ├─ Step 1 (Provision Database): {{ '+5' if challenge_results.challenge6_phoenix.details.step1_database_provisioned else '0' }} pts
            ├─ Step 2 (Provision Web Server): {{ '+5' if challenge_results.challenge6_phoenix.details.step2_webserver_provisioned else '0' }} pts
            ├─ Step 3 (Deploy Application): {{ '+5' if challenge_results.challenge6_phoenix.details.step3_application_deployed else '0' }} pts
            ├─ Step 4 (Validate Service): {{ '+5' if challenge_results.challenge6_phoenix.details.step4_validation_passed else '0' }} pts
            ├─ Step 5 (Rollback Web Server): {{ '+5' if challenge_results.challenge6_phoenix.details.step5_web_rollback else '0' }} pts
            └─ Step 6 (Rollback Database): {{ '+5' if challenge_results.challenge6_phoenix.details.step6_db_rollback else '0' }} pts
          
          Tracker: {{ 'SUCCESS' if tracker_response is defined and tracker_response is succeeded else 'SKIPPED' }}
          ==========================================

