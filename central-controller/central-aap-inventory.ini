# Central AAP Controller Inventory for CTF Sub Controllers
# Configure this inventory in your Central Ansible Platform Controller

[sub_controllers]
# East Coast Sub Controller
sub-controller-east ansible_host=aap-east.company.com
sub-controller-west ansible_host=aap-west.company.com
sub-controller-central ansible_host=aap-central.company.com

[sub_controllers:vars]
# Common connection settings
ansible_connection=local
ansible_python_interpreter="{{ ansible_playbook_python }}"

# Sub Controller Connection Details (use group_vars or host_vars for individual settings)
sub_controller_validate_certs=false
sub_controller_organization="CTF Organization"

# Deployment Configuration
ctf_tracker_url="https://ctf-tracker.apps.your-openshift-cluster.com"
scm_type=git
scm_repository_url="https://github.com/your-org/ctf-ansible-workshop.git"
scm_branch=main
project_name="CTF Challenge Playbooks"
