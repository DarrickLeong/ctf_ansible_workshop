---
# CTF Playbook Deployment to Sub Ansible Controllers
# This playbook deploys CTF playbooks and creates job templates on multiple sub controllers
# Designed to run on Central AAP Controller - works with AAP inventory
# Requires: ansible-core >= 2.12, awx.awx collection

- name: Deploy CTF Playbooks to Sub Ansible Controllers
  hosts: all  # Run against all inventory hosts, filter by variables below
  gather_facts: no
  serial: 1  # Deploy to one controller at a time to avoid overwhelming central controller
  vars:
    # Project and SCM Configuration
    # Override these via job template survey or extra_vars:
    # - scm_source_type: 'git' (default), 'manual', or 'archive'  
    # - scm_repository_url: Git repo URL for your CTF playbooks
    # - scm_source_branch: Git branch to use (default: 'main')
    ctf_project_name: "{{ project_name | default('CTF Challenge Playbooks') }}"
    ctf_project_description: "CTF Challenge Verification and Connectivity Test Playbooks"
    scm_type: "{{ scm_source_type | default('git') }}"  # git, manual, or archive
    scm_url: "{{ scm_repository_url | default('') }}"  # Git repo URL if using git
    scm_branch: "{{ scm_source_branch | default('main') }}"

    # Environment Setup Control
    # Set these to true via extra_vars to automatically run reset/setup after deployment
    auto_run_reset: "{{ run_environment_reset | default(false) }}"
    auto_run_setup: "{{ run_environment_setup | default(false) }}"
    
    # Target inventory/credential for environment setup (required if auto_run enabled)
    target_inventory_name: "{{ environment_inventory | default('') }}"
    target_credential_name: "{{ environment_credential | default('') }}"

    # Job Template Configuration
    job_templates:
      - name: "CTF Environment Reset"
        playbook: "ctf-workshop/setup/reset-environment.yml"
        description: "Reset all CTF challenges to clean state"
        job_type: "run"
        verbosity: 1
        ask_variables_on_launch: false
        ask_inventory_on_launch: true
        ask_credential_on_launch: true
        variables: {}
      - name: "CTF Environment Setup"
        playbook: "ctf-workshop/setup/setup-all-challenges.yml"
        description: "Setup all CTF challenge scenarios (break things)"
        job_type: "run"
        verbosity: 1
        ask_variables_on_launch: false
        ask_inventory_on_launch: true
        ask_credential_on_launch: true
        variables: {}
      - name: "CTF Challenge Validation"
        playbook: "sub-controllers/ctf-challenge-validator.yml"
        description: "Validate CTF challenge solutions and report results"
        job_type: "run"
        verbosity: 1
        ask_variables_on_launch: true
        ask_inventory_on_launch: true
        ask_credential_on_launch: true
        variables:
          ctf_tracker_url: "{{ ctf_tracker_url | default('https://ctf-tracker.apps.your-cluster.com') }}"
          attendee_name: "{{ sub_controller_team_name | default(inventory_hostname + ' Team') }}"
      - name: "CTF Connectivity Test"
        playbook: "sub-controllers/connectivity-test-playbook.yml"
        description: "Test RHEL host connectivity and system health"
        job_type: "run"
        verbosity: 1
        ask_variables_on_launch: true
        ask_inventory_on_launch: true
        ask_credential_on_launch: true
        variables:
          ctf_tracker_url: "{{ ctf_tracker_url | default('https://ctf-tracker.apps.your-cluster.com') }}"
          attendee_name: "{{ sub_controller_team_name | default(inventory_hostname + ' Team') }}"

    # Default execution environment (optional)
    execution_environment: "{{ default_execution_environment | default('Default execution environment') }}"

  # Only run on hosts that have sub controller configuration
  pre_tasks:
    - name: Check if host is a sub controller
      debug:
        msg: |
          Checking host {{ inventory_hostname }}:
          - sub_controller_host: {{ sub_controller_host | default('NOT DEFINED') }}
          - sub_controller_username: {{ sub_controller_username | default('NOT DEFINED') }}
          - has_password: {{ 'YES' if sub_controller_password is defined else 'NO' }}
          - has_token: {{ 'YES' if sub_controller_token is defined else 'NO' }}
    
    - name: Skip hosts that are not sub controllers
      meta: end_host
      when: >
        sub_controller_host is not defined or
        sub_controller_username is not defined or
        (sub_controller_password is not defined and sub_controller_token is not defined)

  tasks:
    - name: Deploy CTF infrastructure to sub controller
      block:
        - name: Validate deployment variables for current controller
          assert:
            that:
              - sub_controller_host is defined
              - sub_controller_username is defined
              - sub_controller_password is defined or sub_controller_token is defined
              - ctf_tracker_url is defined
              - scm_url != "" or scm_type == "manual"
            fail_msg: |
              Required variables missing for controller {{ inventory_hostname }}:
              - sub_controller_host: {{ sub_controller_host | default('NOT DEFINED') }}
              - sub_controller_username: {{ sub_controller_username | default('NOT DEFINED') }}
              - has_password: {{ 'YES' if sub_controller_password is defined else 'NO' }}
              - ctf_tracker_url: {{ ctf_tracker_url | default('NOT DEFINED') }}
              - scm_url: {{ scm_url | default('NOT DEFINED') }} (required unless scm_type=manual)
              - scm_type: {{ scm_type | default('NOT DEFINED') }}
              
              Please ensure all required variables are set via job template survey or extra_vars.

        - name: Set controller connection facts
          set_fact:
            awx_host: "{{ sub_controller_host }}"
            awx_username: "{{ sub_controller_username }}"
            awx_password: "{{ sub_controller_password | default('') }}"
            awx_token: "{{ sub_controller_token | default('') }}"
            awx_validate_certs: "{{ sub_controller_validate_certs | default(false) }}"
            target_organization: "{{ sub_controller_organization | default('Default') }}"

        - name: Display current deployment target
          debug:
            msg: |
              ==========================================
              DEPLOYING TO SUB CONTROLLER
              ==========================================
              Controller: {{ inventory_hostname }}
              Host: {{ awx_host }}
              Organization: {{ target_organization }}
              Project: {{ ctf_project_name }}
              SCM Type: {{ scm_type }}
              SCM URL: {{ scm_url if scm_url else 'Manual/Local files' }}
              ==========================================

        # TEST CONTROLLER CONNECTIVITY
        - name: Test sub controller connectivity
          uri:
            url: "https://{{ awx_host }}/api/controller/v2/"
            method: GET
            user: "{{ awx_username }}"
            password: "{{ awx_password }}"
            force_basic_auth: yes
            validate_certs: "{{ awx_validate_certs }}"
            timeout: 30
          register: ping_result
          failed_when: false
          delegate_to: localhost

        - name: Fail if controller unreachable
          fail:
            msg: "Cannot reach sub controller {{ inventory_hostname }} at {{ awx_host }}"
          when: ping_result.status != 200

        # CREATE OR UPDATE ORGANIZATION (if specified)
        - name: Create/Update Organization on sub controller
          ansible.controller.organization:
            controller_host: "{{ awx_host }}"
            controller_username: "{{ awx_username }}"
            controller_password: "{{ awx_password }}"
            validate_certs: "{{ awx_validate_certs }}"
            name: "{{ target_organization }}"
            description: "Organization for CTF challenges - managed by central controller"
            state: present
          when: target_organization != "Default"
          delegate_to: localhost

        # CREATE PROJECT ON SUB CONTROLLER
        - name: Create CTF Project on sub controller
          ansible.controller.project:
            controller_host: "{{ awx_host }}"
            controller_username: "{{ awx_username }}"
            controller_password: "{{ awx_password }}"
            validate_certs: "{{ awx_validate_certs }}"
            name: "{{ ctf_project_name }}"
            description: "{{ ctf_project_description }} - Deployed from central controller"
            organization: "{{ target_organization }}"
            scm_type: "{{ scm_type }}"
            scm_url: "{{ scm_url if scm_type == 'git' else omit }}"
            scm_branch: "{{ scm_branch if scm_type == 'git' else omit }}"
            scm_update_on_launch: "{{ scm_type == 'git' }}"
            state: present
          register: project_result
          delegate_to: localhost

        # SYNC PROJECT FROM SCM (if using SCM)
        - name: Sync project from SCM on sub controller
          ansible.controller.project_update:
            controller_host: "{{ awx_host }}"
            controller_username: "{{ awx_username }}"
            controller_password: "{{ awx_password }}"
            validate_certs: "{{ awx_validate_certs }}"
            project: "{{ ctf_project_name }}"
            wait: true
            timeout: 180
          when: scm_type != "manual"
          register: sync_result
          delegate_to: localhost

        # CREATE JOB TEMPLATES ON SUB CONTROLLER
        - name: Create CTF Job Templates on sub controller
          ansible.controller.job_template:
            controller_host: "{{ awx_host }}"
            controller_username: "{{ awx_username }}"
            controller_password: "{{ awx_password }}"
            validate_certs: "{{ awx_validate_certs }}"
            name: "{{ item.name }}"
            description: "{{ item.description }} - Managed by central controller"
            job_type: "{{ item.job_type }}"
            project: "{{ ctf_project_name }}"
            playbook: "{{ item.playbook }}"
            verbosity: "{{ item.verbosity | default(0) }}"
            ask_variables_on_launch: "{{ item.ask_variables_on_launch | default(true) }}"
            ask_inventory_on_launch: "{{ item.ask_inventory_on_launch | default(true) }}"
            ask_credential_on_launch: "{{ item.ask_credential_on_launch | default(true) }}"
            extra_vars: "{{ item.variables | default({}) | combine({'sub_controller_name': inventory_hostname}) }}"
            execution_environment: "{{ execution_environment if execution_environment != 'Default execution environment' else omit }}"
            state: present
          loop: "{{ job_templates }}"
          register: job_template_results
          delegate_to: localhost

        # VERIFY DEPLOYMENT
        - name: Verify job templates were created on sub controller
          ansible.controller.job_template:
            controller_host: "{{ awx_host }}"
            controller_username: "{{ awx_username }}"
            controller_password: "{{ awx_password }}"
            validate_certs: "{{ awx_validate_certs }}"
            name: "{{ item.name }}"
            state: present
          loop: "{{ job_templates }}"
          register: verification_results
          delegate_to: localhost

        # REGISTER SUB CONTROLLER IN CTF TRACKER
        - name: Register sub controller in CTF Tracker
          uri:
            url: "{{ ctf_tracker_url }}/api/register_controller"
            method: POST
            body_format: json
            headers:
              Content-Type: "application/json"
            body:
              controller_name: "{{ inventory_hostname }}"
              controller_host: "{{ awx_host }}"
              region: "{{ controller_region | default('sub-controller') }}"
              description: "{{ controller_description | default('AAP Sub Controller') }}"
            validate_certs: no
          register: controller_registration
          ignore_errors: yes
          delegate_to: localhost

        - name: Record successful deployment
          set_fact:
            deployment_success: true
            deployment_project_id: "{{ project_result.id }}"
            deployment_templates: "{{ job_template_results.results | map(attribute='id') | list }}"

        - name: Report deployment success for current controller
          debug:
            msg: |
              ✅ Successfully deployed to {{ inventory_hostname }}:
              - Controller: {{ awx_host }}
              - Organization: {{ target_organization }}
              - Project: {{ ctf_project_name }} (ID: {{ deployment_project_id }})
              - Templates Created: {{ deployment_templates | length }}
              {% for template in job_templates %}
              - Job Template: {{ template.name }}
              {% endfor %}

        # ONBOARD CONTROLLER TO CTF TRACKER
        - name: Debug CTF Tracker URL before onboarding
          debug:
            msg: |
              CTF Tracker Onboarding Debug:
              - ctf_tracker_url: "{{ ctf_tracker_url | default('NOT SET') }}"
              - URL is empty check: {{ ctf_tracker_url == '' }}
              - URL length: {{ ctf_tracker_url | length }}
              - Contains your-cluster: {{ 'your-cluster.com' in ctf_tracker_url }}

        - name: Test CTF Tracker connectivity
          uri:
            url: "{{ ctf_tracker_url }}/api/attendees"
            method: GET
            validate_certs: no
            timeout: 10
          register: ctf_tracker_test
          failed_when: false
          delegate_to: localhost
          when: ctf_tracker_url is defined and ctf_tracker_url | length > 0 and 'your-cluster.com' not in ctf_tracker_url

        - name: Register attendee/team for this controller in CTF Tracker
          uri:
            url: "{{ ctf_tracker_url }}/api/attendees"
            method: POST
            headers:
              Content-Type: "application/json"
            body_format: json
            body:
              name: "{{ sub_controller_team_name | default(inventory_hostname + ' Team') }}"
              email: "{{ sub_controller_team_email | default(inventory_hostname + '@your-company.com') }}"
              team: "{{ sub_controller_region | default('Region-' + inventory_hostname) }}"
              controller: "{{ inventory_hostname }}"
            status_code: [200, 201, 409]  # 409 = already exists (OK)
            validate_certs: no
            timeout: 30
          register: attendee_result
          failed_when: false
          delegate_to: localhost
          when: 
            - ctf_tracker_url is defined and ctf_tracker_url | length > 0 and 'your-cluster.com' not in ctf_tracker_url
            - ctf_tracker_test is succeeded

        - name: Get attendee ID from CTF Tracker
          uri:
            url: "{{ ctf_tracker_url }}/api/attendees"
            method: GET
            validate_certs: no
            timeout: 30
          register: attendees_list
          failed_when: false
          delegate_to: localhost
          when: 
            - ctf_tracker_url is defined and ctf_tracker_url | length > 0 and 'your-cluster.com' not in ctf_tracker_url
            - ctf_tracker_test is succeeded

        - name: Find attendee ID for this controller
          set_fact:
            controller_attendee_id: "{{ (attendees_list.json | selectattr('name', 'equalto', sub_controller_team_name | default(inventory_hostname + ' Team')) | first).id | default('') }}"
          when: 
            - ctf_tracker_url is defined and ctf_tracker_url | length > 0 and 'your-cluster.com' not in ctf_tracker_url
            - ctf_tracker_test is succeeded
            - attendees_list.json is defined

        - name: Register sub-controller as a tracking entity in CTF Tracker
          uri:
            url: "{{ ctf_tracker_url }}/api/machines"
            method: POST
            headers:
              Content-Type: "application/json"
            body_format: json
            body:
              hostname: "{{ inventory_hostname }}"
              ip: "{{ awx_host }}"
              region: "{{ sub_controller_region | default('region-' + inventory_hostname) }}"
              attendee_id: "{{ controller_attendee_id | int }}"
              status: "controller"
              controller_type: "sub-controller"
            status_code: [200, 201, 409]  # 409 = already exists (OK)
            validate_certs: no
            timeout: 30
          register: controller_registration
          failed_when: false
          delegate_to: localhost
          when: 
            - ctf_tracker_url is defined and ctf_tracker_url | length > 0 and 'your-cluster.com' not in ctf_tracker_url
            - ctf_tracker_test is succeeded
            - controller_attendee_id != ''

        - name: Report CTF Tracker onboarding status
          debug:
            msg: |
              🎯 CTF TRACKER ONBOARDING:
              - Attendee Registration: {{ 'SUCCESS' if attendee_result is succeeded else 'SKIPPED/FAILED' }}
              - Team Name: {{ sub_controller_team_name | default(inventory_hostname + ' Team') }}
              - Attendee ID: {{ controller_attendee_id | default('Not found') }}
              - Controller Registration: {{ 'SUCCESS' if controller_registration is succeeded else 'SKIPPED/FAILED' }}
              - Dashboard: {{ ctf_tracker_url }}
          when: 
            - ctf_tracker_url is defined and ctf_tracker_url | length > 0 and 'your-cluster.com' not in ctf_tracker_url
            - ctf_tracker_test is succeeded

        # ==========================================
        # OPTIONAL: AUTOMATIC ENVIRONMENT SETUP
        # ==========================================
        - name: Run Environment Reset (if enabled)
          block:
            - name: Check if auto-run is enabled
              debug:
                msg: "🔄 Auto-run Environment Reset enabled - launching job..."
              
            - name: Get inventory ID
              ansible.controller.inventory:
                controller_host: "{{ awx_host }}"
                controller_username: "{{ awx_username }}"
                controller_password: "{{ awx_password }}"
                validate_certs: "{{ awx_validate_certs }}"
                name: "{{ target_inventory_name }}"
                state: present
              register: inventory_info
              delegate_to: localhost
            
            - name: Get credential ID
              uri:
                url: "https://{{ awx_host }}/api/v2/credentials/?name={{ target_credential_name | urlencode }}"
                method: GET
                user: "{{ awx_username }}"
                password: "{{ awx_password }}"
                force_basic_auth: yes
                validate_certs: "{{ awx_validate_certs }}"
              register: credential_info
              delegate_to: localhost
            
            - name: Launch CTF Environment Reset job
              ansible.controller.job_launch:
                controller_host: "{{ awx_host }}"
                controller_username: "{{ awx_username }}"
                controller_password: "{{ awx_password }}"
                validate_certs: "{{ awx_validate_certs }}"
                job_template: "CTF Environment Reset"
                inventory: "{{ target_inventory_name }}"
                credentials:
                  - "{{ target_credential_name }}"
                wait: true
                timeout: 600
              register: reset_job_result
              delegate_to: localhost
            
            - name: Report Reset job status
              debug:
                msg: |
                  ✅ Environment Reset completed on {{ inventory_hostname }}
                  Job ID: {{ reset_job_result.id }}
                  Status: {{ reset_job_result.status }}
          when:
            - auto_run_reset | bool
            - target_inventory_name != ''
            - target_credential_name != ''

        - name: Run Environment Setup (if enabled)
          block:
            - name: Check if auto-run is enabled
              debug:
                msg: "⚙️ Auto-run Environment Setup enabled - launching job..."
              
            - name: Wait for reset to complete (if it ran)
              pause:
                seconds: 5
              when: reset_job_result is defined and reset_job_result.id is defined
            
            - name: Launch CTF Environment Setup job
              ansible.controller.job_launch:
                controller_host: "{{ awx_host }}"
                controller_username: "{{ awx_username }}"
                controller_password: "{{ awx_password }}"
                validate_certs: "{{ awx_validate_certs }}"
                job_template: "CTF Environment Setup"
                inventory: "{{ target_inventory_name }}"
                credentials:
                  - "{{ target_credential_name }}"
                wait: true
                timeout: 600
              register: setup_job_result
              delegate_to: localhost
            
            - name: Report Setup job status
              debug:
                msg: |
                  ✅ Environment Setup completed on {{ inventory_hostname }}
                  Job ID: {{ setup_job_result.id }}
                  Status: {{ setup_job_result.status }}
          when:
            - auto_run_setup | bool
            - target_inventory_name != ''
            - target_credential_name != ''

      rescue:
        - name: Record deployment failure
          set_fact:
            deployment_success: false
            deployment_error: "{{ ansible_failed_result.msg | default('Unknown error') }}"

        - name: Report deployment failure
          debug:
            msg: |
              ❌ Failed to deploy to {{ inventory_hostname }}:
              - Controller: {{ awx_host }}
              - Error: {{ deployment_error }}

# POST-DEPLOYMENT SUMMARY
- name: Post-Deployment Summary
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    # Import variables from the deployment play
    auto_run_reset: "{{ hostvars[groups['all'][0]]['auto_run_reset'] | default(false) if groups['all'] | length > 0 else false }}"
    auto_run_setup: "{{ hostvars[groups['all'][0]]['auto_run_setup'] | default(false) if groups['all'] | length > 0 else false }}"
  tasks:
    - name: Collect deployment results
      block:
        - name: Initialize deployment lists
          set_fact:
            successful_deployments: []
            failed_deployments: []
            
        - name: Build successful deployments list
          set_fact:
            successful_deployments: "{{ successful_deployments + [item] }}"
          loop: "{{ ansible_play_hosts }}"
          when: 
            - hostvars[item]['deployment_success'] is defined
            - hostvars[item]['deployment_success'] == true
            
        - name: Build failed deployments list  
          set_fact:
            failed_deployments: "{{ failed_deployments + [item] }}"
          loop: "{{ ansible_play_hosts }}"
          when: 
            - hostvars[item]['deployment_success'] is defined
            - hostvars[item]['deployment_success'] == false

    - name: Display final deployment summary
      debug:
        msg: |
          ==========================================
          FINAL DEPLOYMENT SUMMARY
          ==========================================
          Total Sub Controllers: {{ ansible_play_hosts | length }}
          Successful Deployments: {{ successful_deployments | length }}
          Failed Deployments: {{ failed_deployments | length }}
          
          SUCCESSFUL DEPLOYMENTS:
          {% for controller in successful_deployments %}
          ✅ {{ controller }}: {{ hostvars[controller]['awx_host'] }}
          {% endfor %}
          
          {% if failed_deployments | length > 0 %}
          FAILED DEPLOYMENTS:
          {% for controller in failed_deployments %}
          ❌ {{ controller }}: {{ hostvars[controller]['deployment_error'] | default('Unknown error') }}
          {% endfor %}
          {% endif %}
          
          Job Templates Deployed:
          - CTF Environment Reset
          - CTF Environment Setup
          - CTF Challenge Validation
          - CTF Connectivity Test
          
          {% if auto_run_reset or auto_run_setup %}
          AUTOMATIC EXECUTION:
          {% for controller in successful_deployments %}
          {% if hostvars[controller]['reset_job_result'] is defined %}
          🔄 {{ controller }}: Environment Reset - {{ hostvars[controller]['reset_job_result']['status'] | default('Unknown') }} (Job ID: {{ hostvars[controller]['reset_job_result']['id'] | default('N/A') }})
          {% endif %}
          {% if hostvars[controller]['setup_job_result'] is defined %}
          ⚙️ {{ controller }}: Environment Setup - {{ hostvars[controller]['setup_job_result']['status'] | default('Unknown') }} (Job ID: {{ hostvars[controller]['setup_job_result']['id'] | default('N/A') }})
          {% endif %}
          {% endfor %}
          {% endif %}
          
          CTF TRACKER ONBOARDING:
          {% for controller in successful_deployments %}
          {% if hostvars[controller]['controller_attendee_id'] is defined %}
          ✅ {{ controller }}: Registered as {{ hostvars[controller]['sub_controller_team_name'] | default(controller + ' Team') }} (ID: {{ hostvars[controller]['controller_attendee_id'] }})
          {% else %}
          ⚠️ {{ controller }}: CTF tracker registration skipped or failed
          {% endif %}
          {% endfor %}
          
          Dashboard URL: {{ ctf_tracker_url }}
          ==========================================

    - name: Fail if any deployments failed
      fail:
        msg: "{{ failed_deployments | length }} deployment(s) failed. Check logs above."
      when: failed_deployments | length > 0


