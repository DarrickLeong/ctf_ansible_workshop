---
# CTF Workshop - Reset/Cleanup Playbook
# This playbook resets the environment to clean state
# Run this AFTER the workshop or to reset between sessions

- name: CTF Workshop - Reset Environment
  hosts: web
  become: yes
  gather_facts: yes
  
  tasks:
    - name: Display reset information
      debug:
        msg: |
          ==========================================
          CTF Workshop Environment Reset
          ==========================================
          Resetting all challenge scenarios to clean state
          Target Hosts: {{ ansible_play_hosts }}
          ==========================================

# ============================================
# Challenge 1 Reset: Start chronyd
# ============================================
- name: Challenge 1 Reset - Start chronyd service
  hosts: web
  become: yes
  tags: 
    - challenge1
    - reset
  
  tasks:
    - name: Start and enable chronyd service
      service:
        name: chronyd
        state: started
        enabled: yes

# ============================================
# Challenge 2 Reset: Remove unauthorized package
# ============================================
- name: Challenge 2 Reset - Remove unauthorized package from node2
  hosts: node2
  become: yes
  tags:
    - challenge2
    - reset
  
  tasks:
    - name: Remove bind-utils package
      dnf:
        name: bind-utils
        state: absent

# ============================================
# Challenge 3 Reset: Remove rogue user
# ============================================
- name: Challenge 3 Reset - Remove rogue_user
  hosts: web
  become: yes
  tags:
    - challenge3
    - reset
  
  tasks:
    - name: Remove rogue_user account
      user:
        name: rogue_user
        state: absent
        remove: yes
      ignore_errors: yes

# ============================================
# Challenge 4 Reset: Clean MOTD
# ============================================
- name: Challenge 4 Reset - Clean MOTD files
  hosts: web
  become: yes
  tags:
    - challenge4
    - reset
  
  tasks:
    - name: Create default MOTD
      copy:
        content: |
          Welcome to {{ ansible_hostname }}
        dest: /etc/motd
        mode: '0644'

# ============================================
# Challenge 5 Reset: Allow HTTP
# ============================================
- name: Challenge 5 Reset - Allow HTTP on node3
  hosts: node3
  become: yes
  tags:
    - challenge5
    - reset
  
  tasks:
    - name: Install firewalld
      dnf:
        name: firewalld
        state: present
    
    - name: Ensure firewalld is running
      service:
        name: firewalld
        state: started
        enabled: yes
    
    - name: Allow http service in firewall
      firewalld:
        service: http
        permanent: yes
        state: enabled
        immediate: yes

# ============================================
# Challenge 6 Reset: Install services
# ============================================
- name: Challenge 6 Reset - Restore application stack
  hosts: node1,node2
  become: yes
  tags:
    - challenge6
    - reset
  
  tasks:
    - name: Install and start httpd on node1
      block:
        - name: Install httpd
          dnf:
            name: httpd
            state: present
        
        - name: Remove custom httpd configurations
          file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/httpd/conf.d/custom.conf
            - /var/www/html/index.php
          ignore_errors: yes
        
        - name: Reset httpd Listen port to 80
          lineinfile:
            path: /etc/httpd/conf/httpd.conf
            regexp: '^Listen '
            line: 'Listen 80'
          ignore_errors: yes
        
        - name: Create default index.html
          copy:
            content: |
              <html>
              <head><title>Web Server</title></head>
              <body><h1>Web Server on {{ ansible_hostname }}</h1></body>
              </html>
            dest: /var/www/html/index.html
            mode: '0644'
          ignore_errors: yes
        
        - name: Start httpd service
          service:
            name: httpd
            state: started
            enabled: yes
      when: inventory_hostname == 'node1'
    
    - name: Install and start postgresql on node2
      block:
        - name: Install postgresql
          dnf:
            name:
              - postgresql-server
              - postgresql
            state: present
        
        - name: Initialize PostgreSQL database
          command: postgresql-setup --initdb
          args:
            creates: /var/lib/pgsql/data/postgresql.conf
          ignore_errors: yes
        
        - name: Start postgresql service
          service:
            name: postgresql
            state: started
            enabled: yes
      when: inventory_hostname == 'node2'

# ============================================
# Final Reset Summary
# ============================================
- name: Display Reset Summary
  hosts: localhost
  gather_facts: no
  tags:
    - always
  
  tasks:
    - name: Reset Complete
      debug:
        msg: |
          ==========================================
          CTF Workshop Reset Complete!
          ==========================================
          
          ✅ All challenges have been reset to clean state
          
          Environment is ready for next session!
          ==========================================

