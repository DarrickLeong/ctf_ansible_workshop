---
# Challenge 6 Solution - Part 5: Rollback Web Server
# Phoenix Protocol - Full Stack Disaster Recovery
# 
# This playbook rolls back the web server changes if validation fails

- name: Challenge 6 - Rollback Web Server
  hosts: node1
  become: yes
  gather_facts: yes
  
  tasks:
    - name: Stop httpd service
      ansible.builtin.service:
        name: httpd
        state: stopped
        enabled: no
      ignore_errors: yes
    
    - name: Remove application files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/www/html/index.html
        - /var/www/html/index.php
        - /var/www/html/config.txt
      ignore_errors: yes
    
    - name: Restore httpd.conf to default Listen port 80
      ansible.builtin.lineinfile:
        path: /etc/httpd/conf/httpd.conf
        regexp: '^Listen '
        line: 'Listen 80'
      ignore_errors: yes
    
    - name: Remove SELinux port 8080 permission
      community.general.seport:
        ports: 8080
        proto: tcp
        setype: http_port_t
        state: absent
      ignore_errors: yes
    
    - name: Remove firewall rule for port 8080
      ansible.posix.firewalld:
        port: 8080/tcp
        permanent: yes
        state: disabled
        immediate: yes
      ignore_errors: yes
    
    - name: Display rollback result
      ansible.builtin.debug:
        msg: |
          ⚠️ Web server rolled back on {{ inventory_hostname }}
          Services stopped
          Application files removed
          Port 8080 configuration cleaned up

