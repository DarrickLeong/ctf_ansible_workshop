---
# Challenge 6 Solution - Part 4: Validate Service
# Phoenix Protocol - Full Stack Disaster Recovery
# 
# This playbook validates that the application stack is working
# If validation fails, it triggers the rollback workflow

- name: Challenge 6 - Validate Service
  hosts: web
  become: yes
  gather_facts: yes
  
  tasks:
    - name: Check httpd service status
      ansible.builtin.service_facts:
      when: inventory_hostname == 'node1'
    
    - name: Verify httpd is running
      ansible.builtin.assert:
        that:
          - ansible_facts.services['httpd.service'].state == 'running'
        fail_msg: "httpd service is not running!"
        success_msg: "✅ httpd service is running"
      when: inventory_hostname == 'node1'
      register: httpd_status
    
    - name: Check PostgreSQL service status
      ansible.builtin.service_facts:
      when: inventory_hostname == 'node2'
    
    - name: Verify PostgreSQL is running
      ansible.builtin.assert:
        that:
          - ansible_facts.services['postgresql.service'].state == 'running'
        fail_msg: "PostgreSQL service is not running!"
        success_msg: "✅ PostgreSQL service is running"
      when: inventory_hostname == 'node2'
      register: postgresql_status
    
    - name: Test HTTP response from web server
      ansible.builtin.uri:
        url: "http://{{ hostvars['node1']['ansible_default_ipv4']['address'] }}:8080/index.php"
        method: GET
        status_code: 200
        timeout: 10
        return_content: yes
      register: http_test
      failed_when: 
        - http_test.status != 200
        - "'healthy' not in http_test.content"
      when: inventory_hostname == 'node1'
      delegate_to: localhost
    
    - name: Test database connectivity
      ansible.builtin.wait_for:
        host: "{{ ansible_default_ipv4.address }}"
        port: 5432
        timeout: 5
      register: db_test
      when: inventory_hostname == 'node2'
    
    - name: Create validation marker for Challenge 6 scoring
      ansible.builtin.file:
        path: /tmp/phoenix_validated
        state: touch
        mode: '0644'
      when: inventory_hostname == 'node1'
    
    - name: Display validation results
      ansible.builtin.debug:
        msg: |
          ==========================================
          ✅ VALIDATION SUCCESSFUL!
          ==========================================
          Web Server (node1): OPERATIONAL
          - HTTP Status: {{ http_test.status if inventory_hostname == 'node1' else 'N/A' }}
          - Service: Running
          
          Database Server (node2): OPERATIONAL
          - Port 5432 (PostgreSQL): Accessible
          - Service: Running
          
          🔥 Phoenix Protocol Complete! 🔥
          Application stack is fully restored!
          ==========================================

