---
# Challenge 2 Solution: Malicious Package (10 Points)
# 
# Mission: Remove bind-utils package from node2 (database server)
# Points: 10
#
# This playbook demonstrates package management and host targeting

- name: Challenge 2 - Remove Unauthorized Package
  hosts: node2
  become: yes
  gather_facts: yes
  
  tasks:
    - name: Remove bind-utils package from database server
      ansible.builtin.dnf:
        name: bind-utils
        state: absent
      register: package_result
    
    - name: Verify bind-utils is removed
      ansible.builtin.package_facts:
        manager: auto
    
    - name: Check if bind-utils is present
      ansible.builtin.set_fact:
        package_removed: "{{ 'bind-utils' not in ansible_facts.packages }}"
    
    - name: Display result
      ansible.builtin.debug:
        msg: |
          ✅ Challenge 2 Complete on {{ inventory_hostname }}!
          bind-utils removed: {{ package_removed }}
          Package change: {{ package_result.changed }}
    
    - name: Report to CTF Tracker
      ansible.builtin.uri:
        url: "{{ ctf_tracker_url }}/api/challenge_results"
        method: POST
        body_format: json
        headers:
          Content-Type: "application/json"
        body:
          attendee_name: "{{ attendee_name }}"
          hostname: "{{ inventory_hostname }}"
          challenge_results:
            challenge_2:
              completed: "{{ package_removed }}"
              points_earned: "{{ 10 if package_removed else 0 }}"
              max_points: 10
              details:
                package_removed: "{{ package_removed }}"
                target_host: "node2"
          aap_cluster_id: "{{ aap_cluster_id | default('') }}"
        validate_certs: no
      when: 
        - ctf_tracker_url is defined
        - attendee_name is defined
      ignore_errors: yes


