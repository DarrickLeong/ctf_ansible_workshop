---
# Challenge 6 Solution - Part 1: Provision Database
# Phoenix Protocol - Full Stack Disaster Recovery
# 
# This playbook provisions the database server (node2) with PostgreSQL

- name: Challenge 6 - Provision Database Server
  hosts: node2
  become: yes
  gather_facts: yes
  
  tasks:
    - name: Install PostgreSQL packages
      ansible.builtin.dnf:
        name:
          - postgresql-server
          - postgresql
          - python3-psycopg2
        state: present
      register: db_install
    
    - name: Initialize PostgreSQL database
      ansible.builtin.command: postgresql-setup --initdb
      args:
        creates: /var/lib/pgsql/data/postgresql.conf
      ignore_errors: yes
    
    - name: Ensure PostgreSQL service is started and enabled
      ansible.builtin.service:
        name: postgresql
        state: started
        enabled: yes
      register: db_service
    
    - name: Wait for PostgreSQL to be ready
      ansible.builtin.wait_for:
        port: 5432
        host: localhost
        timeout: 30
    
    - name: Display result
      ansible.builtin.debug:
        msg: "✅ Database provisioned on {{ inventory_hostname }}!"


