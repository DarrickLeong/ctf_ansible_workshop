<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTF Tracker Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #2c3e50;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header .subtitle {
            color: #7f8c8d;
            font-size: 1.2em;
        }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        
        .card h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1.3em;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
        }
        
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .status-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border-left: 4px solid #3498db;
        }
        
        .status-value {
            font-size: 2em;
            font-weight: bold;
            color: #2c3e50;
            display: block;
        }
        
        .status-label {
            color: #7f8c8d;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .attendee-list {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        
        .attendee-item {
            padding: 12px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .attendee-item:last-child {
            border-bottom: none;
        }
        
        .attendee-name {
            font-weight: 500;
            color: #2c3e50;
        }
        
        .attendee-score {
            background: #3498db;
            color: white;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.9em;
            font-weight: bold;
        }
        
        .machine-item {
            background: #f8f9fa;
            margin: 8px 0;
            padding: 12px;
            border-radius: 5px;
            border-left: 4px solid #28a745;
        }
        
        .machine-name {
            font-weight: 500;
            color: #2c3e50;
        }
        
        .machine-status {
            font-size: 0.9em;
            color: #6c757d;
        }
        
        .refresh-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s;
        }
        
        .refresh-btn:hover {
            background: #2980b9;
        }
        
        .loading {
            text-align: center;
            color: #7f8c8d;
            font-style: italic;
        }
        
        .error {
            color: #e74c3c;
            background: #fdf2f2;
            padding: 10px;
            border-radius: 5px;
            border-left: 4px solid #e74c3c;
        }
        
        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 CTF Tracker Dashboard</h1>
            <p class="subtitle">Red Hat Ansible Automation Platform CTF Challenge Tracking</p>
        </div>
        
        <div class="dashboard-grid">
            <!-- Statistics Card -->
            <div class="card">
                <h3>📊 Statistics</h3>
                <div class="status-grid">
                    <div class="status-item">
                        <span class="status-value" id="attendee-count">-</span>
                        <span class="status-label">Attendees</span>
                    </div>
                    <div class="status-item">
                        <span class="status-value" id="machine-count">-</span>
                        <span class="status-label">Machines</span>
                    </div>
                    <div class="status-item">
                        <span class="status-value" id="checkpoint-count">-</span>
                        <span class="status-label">Checkpoints</span>
                    </div>
                </div>
                <button class="refresh-btn" onclick="loadDashboard()" style="margin-top: 15px; width: 100%;">
                    🔄 Refresh Data
                </button>
            </div>
            
            <!-- Leaderboard Card -->
            <div class="card">
                <h3>🏆 Leaderboard</h3>
                <div id="leaderboard" class="attendee-list">
                    <div class="loading">Loading leaderboard...</div>
                </div>
            </div>
            
            <!-- Machines Card -->
            <div class="card">
                <h3>🖥️ RHEL Machines</h3>
                <div id="machines" class="attendee-list">
                    <div class="loading">Loading machines...</div>
                </div>
            </div>
            
            <!-- Recent Activity Card -->
            <div class="card">
                <h3>📈 Recent Activity</h3>
                <div id="recent-activity" class="attendee-list">
                    <div class="loading">Loading activity...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // API Base URL (adjust if needed)
        const API_BASE = '/api';
        
        // Load dashboard data
        async function loadDashboard() {
            try {
                // Load statistics
                await loadStatistics();
                
                // Load leaderboard  
                await loadLeaderboard();
                
                // Load machines
                await loadMachines();
                
                // Load recent activity
                await loadRecentActivity();
                
            } catch (error) {
                console.error('Error loading dashboard:', error);
            }
        }
        
        async function loadStatistics() {
            try {
                const [attendees, machines, checkpoints] = await Promise.all([
                    fetch(`${API_BASE}/attendees`).then(r => r.json()),
                    fetch(`${API_BASE}/machines`).then(r => r.json()),
                    fetch(`${API_BASE}/checkpoints`).then(r => r.json())
                ]);
                
                document.getElementById('attendee-count').textContent = attendees.length || 0;
                document.getElementById('machine-count').textContent = machines.length || 0;
                document.getElementById('checkpoint-count').textContent = checkpoints.length || 0;
                
            } catch (error) {
                console.error('Error loading statistics:', error);
                document.getElementById('attendee-count').textContent = '?';
                document.getElementById('machine-count').textContent = '?';
                document.getElementById('checkpoint-count').textContent = '?';
            }
        }
        
        async function loadLeaderboard() {
            try {
                const response = await fetch(`${API_BASE}/leaderboard`);
                const data = await response.json();
                
                const leaderboardEl = document.getElementById('leaderboard');
                
                if (data.length === 0) {
                    leaderboardEl.innerHTML = '<div class="loading">No attendees yet</div>';
                    return;
                }
                
                leaderboardEl.innerHTML = data.slice(0, 10).map((attendee, index) => `
                    <div class="attendee-item">
                        <span class="attendee-name">
                            ${index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}.`}
                            ${attendee.name || `Attendee ${attendee.id}`}
                        </span>
                        <span class="attendee-score">${attendee.score || 0} pts</span>
                    </div>
                `).join('');
                
            } catch (error) {
                console.error('Error loading leaderboard:', error);
                document.getElementById('leaderboard').innerHTML = '<div class="error">Error loading leaderboard</div>';
            }
        }
        
        async function loadMachines() {
            try {
                const response = await fetch(`${API_BASE}/machines`);
                const machines = await response.json();
                
                const machinesEl = document.getElementById('machines');
                
                if (machines.length === 0) {
                    machinesEl.innerHTML = '<div class="loading">No machines registered</div>';
                    return;
                }
                
                machinesEl.innerHTML = machines.map(machine => `
                    <div class="machine-item">
                        <div class="machine-name">🖥️ ${machine.hostname || machine.ip}</div>
                        <div class="machine-status">
                            Status: ${machine.status || 'Unknown'} | 
                            Region: ${machine.region || 'N/A'}
                        </div>
                    </div>
                `).join('');
                
            } catch (error) {
                console.error('Error loading machines:', error);
                document.getElementById('machines').innerHTML = '<div class="error">Error loading machines</div>';
            }
        }
        
        async function loadRecentActivity() {
            try {
                // This would need to be implemented in the backend
                // For now, show placeholder
                document.getElementById('recent-activity').innerHTML = `
                    <div class="attendee-item">
                        <span class="attendee-name">🔄 System started</span>
                        <span class="attendee-score">Ready</span>
                    </div>
                    <div class="attendee-item">
                        <span class="attendee-name">📊 Dashboard loaded</span>
                        <span class="attendee-score">Active</span>
                    </div>
                    <div class="attendee-item">
                        <span class="attendee-name">🎯 CTF Tracker online</span>
                        <span class="attendee-score">Live</span>
                    </div>
                `;
                
            } catch (error) {
                console.error('Error loading recent activity:', error);
                document.getElementById('recent-activity').innerHTML = '<div class="error">Error loading activity</div>';
            }
        }
        
        // Load dashboard when page loads
        document.addEventListener('DOMContentLoaded', loadDashboard);
        
        // Auto-refresh every 30 seconds
        setInterval(loadDashboard, 30000);
    </script>
</body>
</html>
