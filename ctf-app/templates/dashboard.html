<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTF Tracker Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .card h3 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-item {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            display: block;
            color: #fff;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-top: 5px;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            border-left: 4px solid #ffd700;
        }

        .leaderboard-item:first-child {
            border-left-color: #ffd700;
            background: rgba(255, 215, 0, 0.2);
        }

        .leaderboard-item:nth-child(2) {
            border-left-color: #c0c0c0;
            background: rgba(192, 192, 192, 0.2);
        }

        .leaderboard-item:nth-child(3) {
            border-left-color: #cd7f32;
            background: rgba(205, 127, 50, 0.2);
        }

        .attendee-name {
            font-weight: 500;
        }

        .attendee-score {
            font-weight: bold;
            font-size: 1.1rem;
            color: #ffd700;
        }

        .machine-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin: 8px 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }

        .machine-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .status-unknown {
            background: rgba(255, 193, 7, 0.3);
            color: #ffc107;
        }

        .refresh-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
        }

        .loading {
            text-align: center;
            padding: 20px;
            opacity: 0.7;
        }

        .error {
            text-align: center;
            padding: 20px;
            color: #ff6b6b;
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 CTF Tracker Dashboard</h1>
            <p class="subtitle">Red Hat Ansible Automation Platform CTF Challenge Tracking</p>
        </div>

        <div class="dashboard-grid">
            <!-- Statistics Card -->
            <div class="card">
                <h3>📊 Statistics</h3>
                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-value" id="attendee-count">-</span>
                        <div class="stat-label">Attendees</div>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="machine-count">-</span>
                        <div class="stat-label">Machines</div>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="checkpoint-count">-</span>
                        <div class="stat-label">Checkpoints</div>
                    </div>
                </div>
                <button class="refresh-btn" onclick="refreshDashboard()">
                    🔄 Refresh Data
                </button>
            </div>

            <!-- Leaderboard Card -->
            <div class="card">
                <h3>🏆 Leaderboard</h3>
                <div id="leaderboard">
                    <div class="loading">Loading leaderboard...</div>
                </div>
            </div>

            <!-- Machines Card -->
            <div class="card">
                <h3>🖥️ RHEL Machines</h3>
                <div id="machines">
                    <div class="loading">Loading machines...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Simple, clean implementation
        const API_BASE = '/api';

        // Main refresh function
        async function refreshDashboard() {
            console.log('🔄 Refreshing CTF Dashboard...');
            
            try {
                // Load all data in parallel
                const [attendeesData, machinesData, checkpointsData] = await Promise.all([
                    fetchData('/attendees'),
                    fetchData('/machines'),
                    fetchData('/checkpoints')
                ]);

                // Update statistics
                updateStatistics(attendeesData, machinesData, checkpointsData);
                
                // Update leaderboard
                updateLeaderboard(attendeesData);
                
                // Update machines
                updateMachines(machinesData);

                console.log('✅ Dashboard refreshed successfully');
                
            } catch (error) {
                console.error('❌ Error refreshing dashboard:', error);
            }
        }

        // Fetch data with error handling
        async function fetchData(endpoint) {
            try {
                const response = await fetch(`${API_BASE}${endpoint}`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                return await response.json();
            } catch (error) {
                console.error(`Error fetching ${endpoint}:`, error);
                return [];
            }
        }

        // Update statistics
        function updateStatistics(attendees, machines, checkpoints) {
            document.getElementById('attendee-count').textContent = attendees.length || 0;
            document.getElementById('machine-count').textContent = machines.length || 0;
            document.getElementById('checkpoint-count').textContent = checkpoints.length || 0;
        }

        // Update leaderboard - THIS IS THE FIXED VERSION
        function updateLeaderboard(attendees) {
            const leaderboardEl = document.getElementById('leaderboard');
            
            if (!attendees || attendees.length === 0) {
                leaderboardEl.innerHTML = '<div class="loading">No attendees yet</div>';
                return;
            }

            // Sort by total_points descending
            const sortedAttendees = attendees.sort((a, b) => (b.total_points || 0) - (a.total_points || 0));

            // Generate leaderboard HTML
            const leaderboardHTML = sortedAttendees.slice(0, 10).map((attendee, index) => {
                const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}.`;
                return `
                    <div class="leaderboard-item">
                        <span class="attendee-name">
                            ${medal} ${attendee.name || `Attendee ${attendee.id}`}
                        </span>
                        <span class="attendee-score">${attendee.total_points || 0} pts</span>
                    </div>
                `;
            }).join('');

            leaderboardEl.innerHTML = leaderboardHTML;
            
            console.log(`🏆 Leaderboard updated: ${sortedAttendees[0]?.name} leads with ${sortedAttendees[0]?.total_points || 0} points`);
        }

        // Update machines
        function updateMachines(machines) {
            const machinesEl = document.getElementById('machines');
            
            if (!machines || machines.length === 0) {
                machinesEl.innerHTML = '<div class="loading">No machines registered</div>';
                return;
            }

            const machinesHTML = machines.map(machine => `
                <div class="machine-item">
                    <span>🖥️ ${machine.hostname || machine.name || 'Unknown'}</span>
                    <span class="machine-status status-unknown">Unknown</span>
                </div>
            `).join('');

            machinesEl.innerHTML = machinesHTML;
        }

        // Initialize dashboard when page loads
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🎯 CTF Dashboard initialized');
            refreshDashboard();
        });

        // Auto-refresh every 30 seconds
        setInterval(refreshDashboard, 30000);
    </script>
</body>
</html>
