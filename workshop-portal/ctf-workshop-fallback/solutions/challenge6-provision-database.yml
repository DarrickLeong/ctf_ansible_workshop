---
# Challenge 6 Solution - Part 1: Provision Database
# Phoenix Protocol - Full Stack Disaster Recovery
# 
# This playbook provisions the database server (node2)

- name: Challenge 6 - Provision Database Server
  hosts: node2
  become: yes
  gather_facts: yes
  
  tasks:
    - name: Install PostgreSQL packages
      ansible.builtin.dnf:
        name:
          - postgresql-server
          - postgresql
          - python3-psycopg2
        state: present
      register: db_install
    
    - name: Ensure PostgreSQL service is started and enabled
      ansible.builtin.service:
        name: postgresql
        state: started
        enabled: yes
      register: db_service
    
    - name: Wait for PostgreSQL to be ready
      ansible.builtin.wait_for:
        port: 5432
        host: "{{ ansible_default_ipv4.address }}"
        timeout: 30
    
    - name: Create application database
      community.mysql.mysql_db:
        name: ctf_app
        state: present
        login_unix_socket: /var/lib/mysql/mysql.sock
      ignore_errors: yes
    
    - name: Display result
      ansible.builtin.debug:
        msg: |
          ✅ Database provisioned on {{ inventory_hostname }}!
          Packages installed: {{ db_install.changed }}
          Service running: {{ db_service.state }}

