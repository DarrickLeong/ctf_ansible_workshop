---
# Challenge 6 Solution - Part 2: Provision Web Server
# Phoenix Protocol - Full Stack Disaster Recovery
# 
# This playbook provisions the web server (node1)

- name: Challenge 6 - Provision Web Server
  hosts: node1
  become: yes
  gather_facts: yes
  
  tasks:
    - name: Ensure /var/www/html directory exists
      ansible.builtin.file:
        path: /var/www/html
        state: directory
        owner: apache
        group: apache
        mode: '0755'
    
    # Requirement 1: Install httpd, php, php-pgsql, and policycoreutils-python-utils
    - name: Install Apache (httpd), PHP, and SELinux tools
      ansible.builtin.dnf:
        name:
          - httpd
          - php
          - php-pgsql
          - policycoreutils-python-utils
        state: present
      register: web_install
    
    # Requirement 2: Check if port 8080 configured in SELinux, add if not present
    - name: Check if port 8080 is already configured in SELinux
      ansible.builtin.shell: semanage port -l | grep "http_port_t" | grep -w "8080"
      register: selinux_port_check
      failed_when: false
      changed_when: false
    
    - name: Configure SELinux to allow httpd on port 8080
      ansible.builtin.command: semanage port -a -t http_port_t -p tcp 8080
      when: selinux_port_check.rc != 0
      register: selinux_add_result
      failed_when: 
        - selinux_add_result.rc != 0
        - "'already defined' not in selinux_add_result.stderr"
    
    # Requirement 3: Configure httpd to listen on port 8080
    - name: Configure httpd to listen on port 8080
      ansible.builtin.lineinfile:
        path: /etc/httpd/conf/httpd.conf
        regexp: '^Listen '
        line: 'Listen 8080'
        backup: yes
    
    # Requirement 4: Start and enable httpd service
    - name: Start and enable httpd service
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: yes
      register: web_service
    
    # Requirement 5: Allow port 8080/tcp in firewalld
    - name: Check if firewalld is installed
      ansible.builtin.command: which firewall-cmd
      register: firewalld_check
      failed_when: false
      changed_when: false
    
    - name: Install firewalld if not present
      ansible.builtin.dnf:
        name: firewalld
        state: present
      when: firewalld_check.rc != 0
    
    - name: Ensure firewalld is started and enabled
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: yes
    
    - name: Allow port 8080 through firewall
      ansible.builtin.command: firewall-cmd --permanent --add-port=8080/tcp
      register: firewall_add
      changed_when: "'ALREADY_ENABLED' not in firewall_add.stderr"
      failed_when:
        - firewall_add.rc != 0
        - "'ALREADY_ENABLED' not in firewall_add.stderr"
    
    - name: Reload firewall to apply changes
      ansible.builtin.command: firewall-cmd --reload
      when: firewall_add.changed
    
    - name: Display result
      ansible.builtin.debug:
        msg: "✅ Web server provisioned on {{ inventory_hostname }} - listening on port 8080"

