<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBB workshop - CTF Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #fafaf9;
            min-height: 100vh;
            color: #1f2937;
            overflow-x: hidden; /* Prevent horizontal scroll */
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 10px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            padding: 40px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 12px rgba(251, 191, 36, 0.3);
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #000;
            text-shadow: none;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #78350f;
            opacity: 0.9;
        }

        .dashboard-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            width: 100%;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            border: 2px solid #fde68a;
            min-height: 250px;
            flex: 1;
            min-width: 280px;
            max-width: 100%;
        }

        /* Statistics - keep normal size */
        .card:nth-child(1) {
            flex: 1;
            min-width: 280px;
            max-width: 320px;
        }

        /* Leaderboard - much wider */
        .card:nth-child(2) {
            flex: 3;
            min-width: 500px;
        }

        /* Controllers - keep normal size */
        .card:nth-child(3) {
            flex: 1;
            min-width: 300px;
            max-width: 350px;
        }

        /* Recent Activity - much wider */
        .card:nth-child(4) {
            flex: 2.5;
            min-width: 450px;
        }

        /* Responsive: stack on smaller screens */
        @media (max-width: 1400px) {
            .card:nth-child(1), .card:nth-child(2), .card:nth-child(3), .card:nth-child(4) {
                flex: 1 1 45%;
                min-width: 300px;
            }
        }

        @media (max-width: 768px) {
            .card, .card:nth-child(1), .card:nth-child(2), .card:nth-child(3), .card:nth-child(4) {
                flex: 1 1 100%;
                min-width: 100%;
                max-width: 100%;
            }
        }

        .card h3 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #92400e;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-item {
            text-align: center;
            background: #fef3c7;
            padding: 10px 8px;
            border-radius: 8px;
            min-height: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border: 1px solid #fde68a;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            display: block;
            color: #92400e;
            line-height: 1;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #78350f;
            opacity: 0.8;
            line-height: 1;
            word-wrap: break-word;
        }

        /* Responsive stats for larger screens */
        @media (min-width: 1200px) {
            .stats-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }
            
            .stat-item {
                padding: 8px 4px;
                min-height: 70px;
            }
            
            .stat-value {
                font-size: 1.6rem;
            }
            
            .stat-label {
                font-size: 0.75rem;
            }
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start; /* Change to flex-start for better alignment */
            padding: 20px; /* Increase padding */
            margin: 10px 0;
            background: #fffbeb;
            border-radius: 10px;
            border-left: 4px solid #fbbf24;
            border: 1px solid #fde68a;
            border-left: 4px solid #fbbf24;
            min-height: 120px; /* Increase height for more content */
            gap: 15px;
        }

        .leaderboard-item:first-child {
            border-left-color: #fbbf24;
            background: #fef3c7;
        }

        .leaderboard-item:nth-child(2) {
            border-left-color: #d97706;
            background: #fffbeb;
        }

        .leaderboard-item:nth-child(3) {
            border-left-color: #ea580c;
            background: #fff7ed;
        }

        .leaderboard-left {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
        }

        .leaderboard-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            margin-left: 15px;
            min-width: 120px;
        }

        .attendee-name {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 4px;
            word-wrap: break-word;
            color: #1f2937;
        }

        .attendee-progress {
            font-size: 0.85rem;
            color: #78350f;
            opacity: 0.8;
            margin-bottom: 2px;
        }

        .attendee-timestamp {
            font-size: 0.75rem;
            color: #78350f;
            opacity: 0.6;
        }

        .attendee-score {
            font-weight: bold;
            font-size: 1.3rem;
            color: #f59e0b;
            margin-bottom: 2px;
        }

        .attendee-challenges {
            font-size: 0.8rem;
            color: #78350f;
            opacity: 0.8;
        }

        .machine-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            margin: 8px 0;
            background: #fffbeb;
            border-radius: 8px;
            border: 1px solid #fde68a;
            min-height: 60px;
            overflow: hidden;
        }

        .machine-left {
            display: flex;
            align-items: center;
            flex: 1;
            min-width: 0;
            margin-right: 10px;
        }

        .machine-right {
            flex-shrink: 0;
            min-width: 70px;
            max-width: 90px;
        }

        .machine-name {
            font-weight: 500;
            font-size: 0.9rem;
            word-wrap: break-word;
            overflow-wrap: break-word;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2; /* Allow 2 lines */
            -webkit-box-orient: vertical;
            line-height: 1.2;
            color: #1f2937;
        }

        .machine-status {
            padding: 4px 8px;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: bold;
            background: #4CAF50;
            color: white;
            white-space: nowrap;
            text-align: center;
            min-width: 50px;
        }

        .machine-status.unknown {
            background: #FFC107;
            color: #000;
        }

        .refresh-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #f59e0b, #ea580c);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            margin-bottom: 8px;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(45deg, #d97706, #c2410c);
        }

        .clear-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .clear-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(45deg, #ff5252, #e53935);
        }

        .reset-scores-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #f59e0b, #d97706);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 10px;
        }

        .reset-scores-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(45deg, #fbbf24, #f59e0b);
        }

        .loading {
            text-align: center;
            padding: 20px;
            opacity: 0.7;
        }

        .error {
            text-align: center;
            padding: 20px;
            color: #ff6b6b;
        }

        .success {
            color: #4caf50;
            font-weight: bold;
        }

        .activity-item {
            padding: 12px;
            margin: 8px 0;
            background: #fffbeb;
            border-radius: 8px;
            border-left: 3px solid #f59e0b;
            border: 1px solid #fde68a;
            border-left: 3px solid #f59e0b;
            overflow: hidden;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .activity-time {
            font-size: 0.8rem;
            color: #78350f;
            opacity: 0.7;
            margin-bottom: 4px;
        }

        .activity-details {
            font-size: 0.9rem;
            line-height: 1.3;
            word-wrap: break-word;
            overflow-wrap: break-word;
            hyphens: auto;
            color: #1f2937;
        }

        .activity-details strong {
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 CTF Tracker</h1>
            <p class="subtitle">MBB workshop - Red Hat Ansible Automation Platform CTF</p>
        </div>

        <div class="dashboard-grid">
            <!-- Statistics Card -->
            <div class="card">
                <h3>📊 Statistics</h3>
                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-value" id="attendee-count">-</span>
                        <div class="stat-label">Attendees</div>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="machine-count">-</span>
                        <div class="stat-label">Controllers</div>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="challenge-count">-</span>
                        <div class="stat-label">Challenges</div>
                    </div>
                </div>
                <button class="refresh-btn" onclick="loadDashboard()">
                    🔄 Refresh Dashboard
                </button>
                <button class="reset-scores-btn" onclick="resetScoresOnly()">
                    🔄 Reset Scores Only
                </button>
                <button class="clear-btn" onclick="clearAllData()">
                    🗑️ Clear All Data
                </button>
            </div>

            <!-- Leaderboard Card -->
            <div class="card">
                <h3>🏆 Leaderboard</h3>
                <div id="leaderboard">
                    <div class="loading">Loading leaderboard...</div>
                </div>
            </div>

            <!-- Controllers Card -->
            <div class="card">
                <h3>🎛️ Controllers</h3>
                <div id="machines">
                    <div class="loading">Loading controllers...</div>
                </div>
            </div>

            <!-- Recent Activity Card -->
            <div class="card">
                <h3>🔥 Recent Activity</h3>
                <div id="recent-activity">
                    <div class="loading">Loading activity...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Clean, simple CTF Dashboard
        console.log('🎯 CTF Tracker Node.js Dashboard Loading...');

        // Load all dashboard data
        async function loadDashboard() {
            console.log('🔄 Refreshing dashboard...');
            
            try {
                // Load all data in parallel
                await Promise.all([
                    loadStatistics(),
                    loadLeaderboard(),
                    loadMachines(),
                    loadRecentActivity()
                ]);
                
                console.log('✅ Dashboard loaded successfully');
                
            } catch (error) {
                console.error('❌ Error loading dashboard:', error);
            }
        }

        // Load statistics
        async function loadStatistics() {
            try {
                const response = await fetch('/api/stats');
                const stats = await response.json();
                
                document.getElementById('attendee-count').textContent = stats.attendees || 0;
                document.getElementById('machine-count').textContent = stats.machines || 0;
                document.getElementById('challenge-count').textContent = stats.challenges || 0;
                
            } catch (error) {
                console.error('Error loading statistics:', error);
                document.getElementById('attendee-count').textContent = '?';
                document.getElementById('machine-count').textContent = '?';
                document.getElementById('challenge-count').textContent = '?';
            }
        }

        // Load leaderboard - ENHANCED IMPLEMENTATION
        async function loadLeaderboard() {
            try {
                const response = await fetch('/api/leaderboard_enhanced');
                const leaderboard = await response.json();
                
                const leaderboardEl = document.getElementById('leaderboard');
                
                if (!leaderboard || leaderboard.length === 0) {
                    leaderboardEl.innerHTML = '<div class="loading">No attendees yet</div>';
                    return;
                }

                // Generate enhanced leaderboard HTML - show all attendees
                const leaderboardHTML = leaderboard.map((attendee, index) => {
                    const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}.`;
                    
                    // Format timestamp
                    const lastActivity = new Date(attendee.latest_activity);
                    const timeAgo = getTimeAgo(lastActivity);
                    
                    // Build detailed challenge breakdown
                    const challengeTypes = Object.keys(attendee.challenge_progress);
                    
                    // CTF Workshop Challenges with proper names and points
                    const workshopChallenges = [
                        { key: 'challenge1_chronyd', name: 'Challenge 1: Out of Sync', points: 5 },
                        { key: 'challenge2_package_removal', name: 'Challenge 2: Malicious Package', points: 10 },
                        { key: 'challenge3_rogue_user', name: 'Challenge 3: Rogue User Account', points: 15 },
                        { key: 'challenge4_motd', name: 'Challenge 4: Inconsistent Messaging', points: 20 },
                        { key: 'challenge5_firewall', name: 'Challenge 5: Firewall Anomaly', points: 20 },
                        { key: 'challenge6_phoenix', name: 'Challenge 6: Phoenix Protocol', points: 30 }
                    ];
                    
                    let challengeBreakdown = '';
                    if (challengeTypes.length > 0) {
                        // Build challenge list with completion status
                        let challengeListHTML = '<div style="margin-top: 8px; font-size: 0.75rem; line-height: 1.6;">';
                        challengeListHTML += '<div style="margin-bottom: 4px; font-weight: bold;">📋 Challenges:</div>';
                        
                        workshopChallenges.forEach(challenge => {
                            const isCompleted = challengeTypes.includes(challenge.key) && 
                                              attendee.challenge_progress[challenge.key].completed;
                            const pointsEarned = challengeTypes.includes(challenge.key) ? 
                                               attendee.challenge_progress[challenge.key].points_earned : 0;
                            
                            if (isCompleted) {
                                challengeListHTML += `<div>✅ ${challenge.name} (${pointsEarned}/${challenge.points} pts)</div>`;
                            } else if (challengeTypes.includes(challenge.key)) {
                                challengeListHTML += `<div>⏳ ${challenge.name} (${pointsEarned}/${challenge.points} pts)</div>`;
                            } else {
                                challengeListHTML += `<div style="opacity: 0.5;">⬜ ${challenge.name} (0/${challenge.points} pts)</div>`;
                            }
                        });
                        
                        challengeListHTML += '</div>';
                        challengeBreakdown = challengeListHTML;
                    } else {
                        // Show available challenges as a list
                        let challengeListHTML = '<div style="margin-top: 8px; font-size: 0.75rem; line-height: 1.6; opacity: 0.7;">';
                        challengeListHTML += '<div style="margin-bottom: 4px; font-weight: bold;">📋 Available Challenges:</div>';
                        
                        workshopChallenges.forEach(challenge => {
                            challengeListHTML += `<div>⬜ ${challenge.name} (${challenge.points} pts)</div>`;
                        });
                        
                        challengeListHTML += '</div>';
                        challengeBreakdown = challengeListHTML;
                    }
                    
                    // Explain completion ratio (3/4 means 3 challenge results out of 4 total attempts)
                    const completionExplanation = attendee.total_challenges > 0 
                        ? `${attendee.challenges_completed}/${attendee.total_challenges} results (${attendee.completion_rate}% success rate)`
                        : 'No attempts yet';
                    
                    return `
                        <div class="leaderboard-item">
                            <div class="leaderboard-left">
                                <div class="attendee-name">
                                    ${medal} ${attendee.name || `Team ${attendee.id}`}
                                </div>
                                <div class="attendee-progress">
                                    📊 ${completionExplanation}
                                </div>
                                <div class="attendee-timestamp">
                                    🕒 Last activity: ${timeAgo}
                                </div>
                                ${challengeBreakdown}
                            </div>
                            <div class="leaderboard-right">
                                <div class="attendee-score">${attendee.total_points} pts</div>
                                <div class="attendee-challenges">${attendee.unique_challenges} challenge types</div>
                            </div>
                        </div>
                    `;
                }).join('');

                leaderboardEl.innerHTML = leaderboardHTML;
                
                if (leaderboard.length > 0) {
                    console.log(`🏆 Leaderboard: ${leaderboard[0].name} leads with ${leaderboard[0].total_points} points`);
                }
                
            } catch (error) {
                console.error('Error loading leaderboard:', error);
                document.getElementById('leaderboard').innerHTML = '<div class="error">Error loading leaderboard</div>';
            }
        }

        // Helper function to format time ago
        function getTimeAgo(date) {
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / (1000 * 60));
            const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
            const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            
            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return `${diffMins}m ago`;
            if (diffHours < 24) return `${diffHours}h ago`;
            return `${diffDays}d ago`;
        }

        // Load machines
        async function loadMachines() {
            try {
                const response = await fetch('/api/machines');
                const machines = await response.json();
                
                const machinesEl = document.getElementById('machines');
                
                if (!machines || machines.length === 0) {
                    machinesEl.innerHTML = '<div class="loading">No controllers registered</div>';
                    return;
                }

                const machinesHTML = machines.map(machine => {
                    const status = machine.status || 'Unknown';
                    const statusClass = status.toLowerCase() === 'active' ? '' : 'unknown';
                    
                    return `
                        <div class="machine-item">
                            <div class="machine-left">
                                <div class="machine-name" title="${machine.hostname}">🎛️ ${machine.hostname}</div>
                            </div>
                            <div class="machine-right">
                                <span class="machine-status ${statusClass}">${status}</span>
                            </div>
                        </div>
                    `;
                }).join('');

                machinesEl.innerHTML = machinesHTML;
                
            } catch (error) {
                console.error('Error loading controllers:', error);
                document.getElementById('machines').innerHTML = '<div class="error">Error loading controllers</div>';
            }
        }

        // Load recent activity
        async function loadRecentActivity() {
            try {
                const response = await fetch('/api/recent_results');
                const results = await response.json();
                
                const activityEl = document.getElementById('recent-activity');
                
                if (!results || results.length === 0) {
                    activityEl.innerHTML = '<div class="loading">No recent activity</div>';
                    return;
                }

                // Map challenge types to friendly names
                const challengeNames = {
                    'challenge1_chronyd': 'Challenge 1: Out of Sync',
                    'challenge2_package_removal': 'Challenge 2: Malicious Package',
                    'challenge3_rogue_user': 'Challenge 3: Rogue User Account',
                    'challenge4_motd': 'Challenge 4: Inconsistent Messaging',
                    'challenge5_firewall': 'Challenge 5: Firewall Anomaly',
                    'challenge6_phoenix': 'Challenge 6: Phoenix Protocol'
                };
                
                const activityHTML = results.slice(0, 5).map(result => {
                    const challengeName = challengeNames[result.challenge_type] || result.challenge_type;
                    // Format timestamp in GMT+8 (Singapore/Asia timezone)
                    const timestamp = new Date(result.timestamp).toLocaleString('en-US', {
                        timeZone: 'Asia/Singapore',
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit',
                        hour12: true
                    });
                    return `
                        <div class="activity-item">
                            <div class="activity-time">${timestamp}</div>
                            <div><strong>${result.attendee_name}</strong> completed <em>${challengeName}</em></div>
                            <div class="success">+${result.points_earned} points</div>
                        </div>
                    `;
                }).join('');

                activityEl.innerHTML = activityHTML;
                
            } catch (error) {
                console.error('Error loading recent activity:', error);
                document.getElementById('recent-activity').innerHTML = '<div class="error">Error loading activity</div>';
            }
        }

        // Clear all data function
        async function resetScoresOnly() {
            // Confirm before resetting
            if (!confirm('⚠️ Reset Scores and Activity?\n\nThis will clear:\n• All challenge results and points\n• Recent activity history\n\nThis will KEEP:\n• Registered attendees/teams\n• Registered controllers\n\nScores will reset to 0. Continue?')) {
                return;
            }

            console.log('🔄 Resetting scores and activity...');
            
            try {
                const response = await fetch('/api/reset_scores', {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const result = await response.json();
                    console.log('✅ Scores reset successfully:', result);
                    
                    // Show success message
                    alert('✅ Scores Reset Successfully!\n\n' + result.message);
                    
                    // Reload the dashboard
                    loadDashboard();
                } else {
                    const error = await response.json();
                    console.error('❌ Failed to reset scores:', error);
                    alert('❌ Error: ' + error.error);
                }
            } catch (error) {
                console.error('❌ Network error:', error);
                alert('❌ Network error: ' + error.message);
            }
        }

        async function clearAllData() {
            // Confirm before clearing
            if (!confirm('⚠️ Are you sure you want to clear ALL data?\n\nThis will delete:\n• All attendees\n• All controllers\n• All challenge results\n• All activity history\n\nThis action cannot be undone!')) {
                return;
            }

            console.log('🗑️ Clearing all CTF data...');
            
            try {
                const response = await fetch('/api/clear_all', {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const result = await response.json();
                    console.log('✅ Data cleared successfully:', result);
                    
                    // Show success message
                    alert('🗑️ All data cleared successfully!\n\nYou can now test onboarding and playbooks from scratch.');
                    
                    // Refresh dashboard to show empty state
                    await loadDashboard();
                    
                } else {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
            } catch (error) {
                console.error('❌ Error clearing data:', error);
                alert('❌ Error clearing data: ' + error.message);
            }
        }

        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', loadDashboard);

        // Auto-refresh every 30 seconds
        setInterval(loadDashboard, 30000);

        console.log('🎯 CTF Tracker Node.js Dashboard Ready!');
    </script>
</body>
</html>
